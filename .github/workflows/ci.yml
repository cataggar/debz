name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install metadata decompression dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends liblzma-dev
      - name: Build and test
        run: |
          zig build
          zig build test
          zig build -Doptimize=ReleaseSafe
          zig build -Doptimize=ReleaseSafe test
          zig build run -- --help
