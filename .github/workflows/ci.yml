name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ubuntu_snapshot_uri:
        description: "Pinned immutable Ubuntu snapshot URI"
        required: true
        type: string
        default: "https://snapshot.ubuntu.com/ubuntu/20260923T000000Z"
      ubuntu_snapshot_suite:
        description: "Pinned snapshot suite/codename"
        required: true
        type: string
        default: "stonking"
      run_arm64_dpkg_oracles:
        description: "Capture pinned dpkg 1.22.22 ARM64 oracle evidence"
        required: true
        type: boolean
        default: false
      run_native_real_snapshot:
        description: "Run native real-snapshot acceptance on amd64 and arm64"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  attestations: read

jobs:
  setup-action-unit:
    name: Setup action unit and bundle checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Test and reproduce setup action bundles
        run: |
          npm --prefix actions/setup ci
          npm --prefix actions/setup audit --audit-level=high
          npm --prefix actions/setup test
          npm --prefix actions/setup run bundle
          git diff --exit-code -- actions/setup/dist

  setup-action-native:
    name: Setup action native (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            digest: 80c63abc6ba357733440de57b1f93441b1ac32d6a65da7dbfca4ccb78e1935ae
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            digest: 02833d0967790b309e0381a97f9b8e915549578fa60e0fdd0ff8a2b62ef1db6e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install v0.2.0 with GitHub provenance
        id: setup-provenance
        uses: ./actions/setup
        with:
          debz-version: v0.2.0
          cache: 'true'
      - name: Validate provenance installation
        env:
          CACHE_HIT: ${{ steps.setup-provenance.outputs.cache-hit }}
          DEBZ_PATH: ${{ steps.setup-provenance.outputs.debz-path }}
          DEBZ_VERSION: ${{ steps.setup-provenance.outputs.debz-version }}
          EXPECTED_TARGET: ${{ matrix.target }}
          TARGET: ${{ steps.setup-provenance.outputs.target }}
        run: |
          test -x "$DEBZ_PATH"
          test "$DEBZ_VERSION" = v0.2.0
          test "$TARGET" = "$EXPECTED_TARGET"
          case "$CACHE_HIT" in true|false) ;; *) exit 1 ;; esac
          test "$("$DEBZ_PATH" --version)" = 0.2.0
          "$DEBZ_PATH" --help >/dev/null
      - name: Install v0.2.0 with explicit trusted SHA-256
        id: setup-sha
        uses: ./actions/setup
        with:
          debz-version: v0.2.0
          sha256: ${{ matrix.digest }}
          cache: 'false'
      - name: Validate trusted-SHA installation
        env:
          DEBZ_PATH: ${{ steps.setup-sha.outputs.debz-path }}
          DEBZ_VERSION: ${{ steps.setup-sha.outputs.debz-version }}
          EXPECTED_TARGET: ${{ matrix.target }}
          TARGET: ${{ steps.setup-sha.outputs.target }}
        run: |
          test -x "$DEBZ_PATH"
          test "$DEBZ_VERSION" = v0.2.0
          test "$TARGET" = "$EXPECTED_TARGET"
          test "$("$DEBZ_PATH" --version)" = 0.2.0

  setup-action-container:
    name: Setup action in bare Ubuntu container
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm optional host tools are absent
        shell: sh
        run: |
          ! command -v python3
          ! command -v pipx
          ! command -v curl
          ! command -v gh
      - name: Install v0.2.0 without host download or archive tools
        id: setup
        uses: ./actions/setup
        with:
          debz-version: v0.2.0
          cache: 'false'
      - name: Validate clean-container installation
        shell: sh
        env:
          DEBZ_PATH: ${{ steps.setup.outputs.debz-path }}
          DEBZ_VERSION: ${{ steps.setup.outputs.debz-version }}
          TARGET: ${{ steps.setup.outputs.target }}
        run: |
          test -x "$DEBZ_PATH"
          test "$DEBZ_VERSION" = v0.2.0
          test "$TARGET" = linux-x64
          test "$("$DEBZ_PATH" --version)" = 0.2.0

  download-action-unit:
    name: Download action unit and bundle checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Test and reproduce download action bundle
        run: |
          npm --prefix actions/download ci
          npm --prefix actions/download audit --audit-level=high
          npm --prefix actions/download test
          npm --prefix actions/download run bundle
          git diff --exit-code -- actions/download/dist

  install-action-unit:
    name: Install action unit and bundle checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Test and reproduce install action bundle
        run: |
          npm --prefix actions/install ci
          npm --prefix actions/install audit --audit-level=high
          npm --prefix actions/install test
          npm --prefix actions/install run bundle
          git diff --exit-code -- actions/install/dist

  install-action-native:
    name: Install action native transaction (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Build CLI and action test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-jsonschema
          zig build -Doptimize=ReleaseSafe
          npm --prefix actions/install ci
          npm --prefix actions/install run build
      - name: Create signed exact-lock fixture
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          workspace="$PWD/.zig-cache/install-action-native"
          mkdir -p "$workspace/plan-root" "$workspace/plan-cache" "$workspace/plan-state"
          python3 tools/generate-integration-repository.py \
            --output "$workspace/repository" --suite debian-stable \
            --architecture "$ARCHITECTURE"
          cat >"$workspace/fixture.sources" <<EOF
          Types: deb
          URIs: file://$workspace/repository
          Suites: debian-stable
          Components: main
          Architectures: $ARCHITECTURE
          Signed-By: $workspace/repository/fixture-keyring.gpg
          EOF
          zig-out/bin/debz plan \
            --install-root "$workspace/plan-root" \
            --cache-path "$workspace/plan-cache" \
            --state-path "$workspace/plan-state" \
            --architecture "$ARCHITECTURE" \
            --source "$workspace/fixture.sources" \
            --keyring "$workspace/repository/fixture-keyring.gpg" \
            --lock-output "$workspace/lock.json" scenario-main --json >/dev/null
          zig-out/bin/debz plan \
            --install-root "$workspace/plan-root" \
            --cache-path "$workspace/plan-cache" \
            --state-path "$workspace/plan-state" \
            --architecture "$ARCHITECTURE" \
            --source "$workspace/fixture.sources" \
            --keyring "$workspace/repository/fixture-keyring.gpg" \
            --lock-output "$workspace/fail.lock.json" fail-script --json >/dev/null
      - name: Exercise cold, warm, offline, and same-root installs
        env:
          DEBZ_INSTALL_INTEGRATION: '1'
          DEBZ_INSTALL_INTEGRATION_SUDO: '1'
          DEBZ_INSTALL_FIXTURE_ROOT: ${{ github.workspace }}/.zig-cache/install-action-native
          DEBZ_INSTALL_CLI: ${{ github.workspace }}/zig-out/bin/debz
          DEBZ_INSTALL_ARCHITECTURE: ${{ matrix.architecture }}
        run: node --test --test-concurrency=1 actions/install/lib/__tests__/integration.test.js
      - name: Normalize install diagnostics
        if: always()
        run: sudo chown -R "$USER:$USER" .zig-cache/install-action-native || true

  download-action-cache:
    name: Download action cache semantics
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Build unique CLI and exact locks
        id: fixture
        env:
          VERSION: 0.3.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe \
            -Dversion="$VERSION"
          workspace="$PWD/.zig-cache/download-action"
          mkdir -p "$workspace/root" "$workspace/metadata" "$workspace/state"
          python3 tools/generate-integration-repository.py \
            --output "$workspace/repository" --suite debian-stable --architecture amd64
          cat >"$workspace/fixture.sources" <<EOF
          Types: deb
          URIs: file://$workspace/repository
          Suites: debian-stable
          Components: main
          Architectures: amd64
          Signed-By: $workspace/repository/fixture-keyring.gpg
          EOF
          common=(
            --install-root "$workspace/root"
            --cache-path "$workspace/metadata"
            --state-path "$workspace/state"
            --architecture amd64
            --source "$workspace/fixture.sources"
            --keyring "$workspace/repository/fixture-keyring.gpg"
            --json
          )
          zig-out/bin/debz plan "${common[@]}" \
            --lock-output "$workspace/base.lock.json" base-dep >/dev/null
          zig-out/bin/debz plan "${common[@]}" \
            --lock-output "$workspace/scenario.lock.json" scenario-main >/dev/null
          zig-out/bin/debz plan "${common[@]}" --transaction-backend native \
            --lock-output "$workspace/base.native.lock.json" base-dep >/dev/null
          zig-out/bin/debz plan "${common[@]}" --transaction-backend native \
            --lock-output "$workspace/scenario.native.lock.json" scenario-main >/dev/null
          python3 - "$workspace/base.native.lock.json" "$workspace/empty.native.lock.json" <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import sys

          value = json.loads(Path(sys.argv[1]).read_bytes())
          assert value["schema"] == "https://debz.dev/schema/exact-closure-lock-v3"
          assert value["version"] == 3
          assert list(value) == [
              "schema", "version", "target_architecture", "request_sha256",
              "policy_sha256", "repositories", "local_artifacts", "packages",
              "digest_sha256",
          ]
          canonical = lambda document: json.dumps(document, separators=(",", ":"), ensure_ascii=False).encode()
          digest = value.pop("digest_sha256")
          assert digest == sha256(canonical(value)).hexdigest()
          value["request_sha256"] = sha256(b"native-action-empty-cache").hexdigest()
          value["repositories"] = []
          value["local_artifacts"] = []
          value["packages"] = []
          value["digest_sha256"] = sha256(canonical(value)).hexdigest()
          Path(sys.argv[2]).write_bytes(canonical(value))
          PY
          printf 'workspace=%s\nsource=%s\nkeyring=%s\nbase_lock=%s\nscenario_lock=%s\n' \
            "$workspace" "$workspace/fixture.sources" \
            "$workspace/repository/fixture-keyring.gpg" \
            "$workspace/base.lock.json" "$workspace/scenario.lock.json" \
            >>"$GITHUB_OUTPUT"
          printf 'native_base_lock=%s\nnative_scenario_lock=%s\nnative_empty_lock=%s\n' \
            "$workspace/base.native.lock.json" "$workspace/scenario.native.lock.json" \
            "$workspace/empty.native.lock.json" >>"$GITHUB_OUTPUT"
          printf '%s\n' "$PWD/zig-out/bin" >>"$GITHUB_PATH"
      - name: Populate cold exact-lock cache
        id: cold
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.base_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-cold
      - name: Validate cold result
        env:
          CACHE_HIT: ${{ steps.cold.outputs.cache-hit }}
          MATCHED: ${{ steps.cold.outputs.cache-matched-key }}
          DOWNLOADED: ${{ steps.cold.outputs.downloaded-count }}
          REUSED: ${{ steps.cold.outputs.reused-count }}
        run: |
          test "$CACHE_HIT" = false
          test -z "$MATCHED"
          test "$DOWNLOADED" -gt 0
          test "$REUSED" -eq 0
      - name: Restore compatible partial cache
        id: partial
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-partial
      - name: Validate partial result
        env:
          CACHE_HIT: ${{ steps.partial.outputs.cache-hit }}
          MATCHED: ${{ steps.partial.outputs.cache-matched-key }}
          DOWNLOADED: ${{ steps.partial.outputs.downloaded-count }}
          REUSED: ${{ steps.partial.outputs.reused-count }}
        run: |
          test "$CACHE_HIT" = false
          test -n "$MATCHED"
          test "$DOWNLOADED" -gt 0
          test "$REUSED" -gt 0
      - name: Restore exact completed cache
        id: exact
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-exact
      - name: Validate exact result
        env:
          CACHE_HIT: ${{ steps.exact.outputs.cache-hit }}
          MATCHED: ${{ steps.exact.outputs.cache-matched-key }}
          DOWNLOADED: ${{ steps.exact.outputs.downloaded-count }}
          REUSED: ${{ steps.exact.outputs.reused-count }}
        run: |
          test "$CACHE_HIT" = true
          test -n "$MATCHED"
          test "$DOWNLOADED" -eq 0
          test "$REUSED" -gt 0
      - name: Corrupt one exact-restored object
        run: |
          object=$(find "$RUNNER_TEMP/debz-download-exact/packages-v2/objects" \
            -maxdepth 1 -type f -print -quit)
          test -n "$object"
          printf 'corrupt\n' >"$object"
      - name: Reject corrupt package object
        id: corrupt
        continue-on-error: true
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-exact
          cache: 'false'
          offline: 'true'
      - name: Validate corrupt-object failure
        env:
          CACHE_PATH: ${{ steps.corrupt.outputs.cache-path }}
          OUTCOME: ${{ steps.corrupt.outcome }}
        run: |
          test "$OUTCOME" = failure
          test -z "$CACHE_PATH"
          rm -rf "$RUNNER_TEMP/debz-download-exact"
      - name: Reject package-only offline restore
        id: offline
        continue-on-error: true
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-offline
          offline: 'true'
      - name: Validate offline metadata failure
        env:
          CACHE_PATH: ${{ steps.offline.outputs.cache-path }}
          OUTCOME: ${{ steps.offline.outcome }}
        run: |
          test "$OUTCOME" = failure
          test -z "$CACHE_PATH"
      - name: Populate native cold cache
        id: native-cold
        uses: ./actions/download
        with:
          transaction-backend: native
          lock-input: ${{ steps.fixture.outputs.native_base_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-native-cold
      - name: Restore native partial cache
        id: native-partial
        uses: ./actions/download
        with:
          transaction-backend: native
          lock-input: ${{ steps.fixture.outputs.native_scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-native-partial
      - name: Restore native exact cache
        id: native-exact
        uses: ./actions/download
        with:
          transaction-backend: native
          lock-input: ${{ steps.fixture.outputs.native_scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-native-exact
      - name: Validate native cache lifecycle
        env:
          COLD_HIT: ${{ steps.native-cold.outputs.cache-hit }}
          COLD_DOWNLOADED: ${{ steps.native-cold.outputs.downloaded-count }}
          COLD_REUSED: ${{ steps.native-cold.outputs.reused-count }}
          PARTIAL_HIT: ${{ steps.native-partial.outputs.cache-hit }}
          PARTIAL_KEY: ${{ steps.native-partial.outputs.cache-matched-key }}
          PARTIAL_DOWNLOADED: ${{ steps.native-partial.outputs.downloaded-count }}
          PARTIAL_REUSED: ${{ steps.native-partial.outputs.reused-count }}
          EXACT_HIT: ${{ steps.native-exact.outputs.cache-hit }}
          EXACT_KEY: ${{ steps.native-exact.outputs.cache-matched-key }}
          EXACT_DOWNLOADED: ${{ steps.native-exact.outputs.downloaded-count }}
          EXACT_REUSED: ${{ steps.native-exact.outputs.reused-count }}
        run: |
          test "$COLD_HIT" = false
          test "$COLD_DOWNLOADED" -gt 0
          test "$COLD_REUSED" -eq 0
          test "$PARTIAL_HIT" = false
          test "$PARTIAL_DOWNLOADED" -gt 0
          test "$PARTIAL_REUSED" -gt 0
          test "$EXACT_HIT" = true
          test "$EXACT_DOWNLOADED" -eq 0
          test "$EXACT_REUSED" -gt 0
          case "$PARTIAL_KEY:$EXACT_KEY" in
            debz-package-cas-v5-*:debz-package-cas-v5-*) ;;
            *) exit 1 ;;
          esac
      - name: Populate native empty cache
        id: native-empty
        uses: ./actions/download
        with:
          transaction-backend: native
          lock-input: ${{ steps.fixture.outputs.native_empty_lock }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-native-empty
          offline: 'true'
      - name: Restore native empty cache
        id: native-empty-exact
        uses: ./actions/download
        with:
          transaction-backend: native
          lock-input: ${{ steps.fixture.outputs.native_empty_lock }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-native-empty-exact
          offline: 'true'
      - name: Validate native empty closure
        env:
          COLD_HIT: ${{ steps.native-empty.outputs.cache-hit }}
          COLD_DOWNLOADED: ${{ steps.native-empty.outputs.downloaded-count }}
          COLD_REUSED: ${{ steps.native-empty.outputs.reused-count }}
          EXACT_HIT: ${{ steps.native-empty-exact.outputs.cache-hit }}
          EXACT_DOWNLOADED: ${{ steps.native-empty-exact.outputs.downloaded-count }}
          EXACT_REUSED: ${{ steps.native-empty-exact.outputs.reused-count }}
        run: |
          test "$COLD_HIT" = false
          test "$COLD_DOWNLOADED" -eq 0
          test "$COLD_REUSED" -eq 0
          test "$EXACT_HIT" = true
          test "$EXACT_DOWNLOADED" -eq 0
          test "$EXACT_REUSED" -eq 0
      - name: Refuse legacy lock in native action
        id: native-foreign-lock
        continue-on-error: true
        uses: ./actions/download
        with:
          transaction-backend: native
          lock-input: ${{ steps.fixture.outputs.base_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-native-foreign-lock
      - name: Refuse native lock in default legacy action
        id: legacy-foreign-lock
        continue-on-error: true
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.native_base_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-legacy-foreign-lock
      - name: Validate explicit backend refusal
        env:
          NATIVE_OUTCOME: ${{ steps.native-foreign-lock.outcome }}
          NATIVE_PATH: ${{ steps.native-foreign-lock.outputs.cache-path }}
          LEGACY_OUTCOME: ${{ steps.legacy-foreign-lock.outcome }}
          LEGACY_PATH: ${{ steps.legacy-foreign-lock.outputs.cache-path }}
        run: |
          test "$NATIVE_OUTCOME" = failure
          test -z "$NATIVE_PATH"
          test "$LEGACY_OUTCOME" = failure
          test -z "$LEGACY_PATH"

  download-action-container-fixture:
    name: Build download action container fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Build static CLI and signed fixture
        run: |
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe \
            -Dversion=0.3.0-ci.${{ github.run_id }}.${{ github.run_attempt }} \
            release-install --prefix "$PWD/out/download-container/release"
          python3 tools/generate-integration-repository.py \
            --output "$PWD/out/download-container/repository" \
            --suite debian-stable --architecture amd64
      - name: Upload container fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: download-action-container-fixture
          path: out/download-container
          if-no-files-found: error
          retention-days: 1

  download-action-container:
    name: Download action in bare Ubuntu container
    needs: download-action-container-fixture
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download prepared fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: download-action-container-fixture
          path: out/download-container
      - name: Confirm optional host tools are absent and create lock
        id: fixture
        shell: sh
        run: |
          ! command -v python3
          ! command -v pipx
          ! command -v curl
          ! command -v gh
          workspace="$PWD/out/download-container"
          chmod 0755 "$workspace/release/bin/debz"
          mkdir -p "$workspace/root" "$workspace/metadata" "$workspace/state"
          cat >"$workspace/fixture.sources" <<EOF
          Types: deb
          URIs: file://$workspace/repository
          Suites: debian-stable
          Components: main
          Architectures: amd64
          Signed-By: $workspace/repository/fixture-keyring.gpg
          EOF
          "$workspace/release/bin/debz" plan \
            --install-root "$workspace/root" \
            --cache-path "$workspace/metadata" \
            --state-path "$workspace/state" \
            --architecture amd64 \
            --source "$workspace/fixture.sources" \
            --keyring "$workspace/repository/fixture-keyring.gpg" \
            --lock-output "$workspace/lock.json" scenario-main --json >/dev/null
          printf 'source=%s\nkeyring=%s\nlock=%s\n' \
            "$workspace/fixture.sources" \
            "$workspace/repository/fixture-keyring.gpg" \
            "$workspace/lock.json" >>"$GITHUB_OUTPUT"
          printf '%s\n' "$workspace/release/bin" >>"$GITHUB_PATH"
      - name: Prepare closure without host package or download tools
        id: download
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache: 'false'
      - name: Validate clean-container download
        shell: sh
        env:
          CACHE_HIT: ${{ steps.download.outputs.cache-hit }}
          DOWNLOADED: ${{ steps.download.outputs.downloaded-count }}
          REUSED: ${{ steps.download.outputs.reused-count }}
        run: |
          test "$CACHE_HIT" = false
          test "$DOWNLOADED" -gt 0
          test "$REUSED" -eq 0
      - name: Execute cache-only transaction directly as container root
        shell: sh
        env:
          CACHE_ROOT: ${{ steps.download.outputs.cache-root }}
          LOCK: ${{ steps.fixture.outputs.lock }}
          SOURCE: ${{ steps.fixture.outputs.source }}
          KEYRING: ${{ steps.fixture.outputs.keyring }}
        run: |
          workspace="$PWD/out/download-container"
          mkdir -p "$workspace/install-root" "$workspace/install-state"
          "$workspace/release/bin/debz" install \
            --install-root "$workspace/install-root" \
            --cache-path "$CACHE_ROOT" \
            --state-path "$workspace/install-state" \
            --architecture amd64 \
            --source "$SOURCE" \
            --keyring "$KEYRING" \
            --lock-input "$LOCK" \
            --repository-policy strict-priority \
            --cache-only --assume-yes --noninteractive \
            --conffile keep-existing --json scenario-main \
            >"$workspace/install-command.json"
          "$workspace/release/bin/debz" transaction-result verify \
            --state-path "$workspace/install-state" \
            --lock-input "$LOCK" --architecture amd64 --json \
            >"$workspace/install-summary.json"
          grep -q '"exit_status":0' "$workspace/install-command.json"
          grep -q '"outcome":"succeeded"' "$workspace/install-summary.json"

  build-and-test-workload:
    name: Build and test workload (${{ matrix.name }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        name: [linux-x64, linux-arm64]
        optimize: [Debug, ReleaseSafe]
        include:
          - os: ubuntu-24.04
            name: linux-x64
            architecture: amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
            architecture: arm64
    env:
      OPTIMIZE: ${{ matrix.optimize }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Install metadata decompression dependency
        run: |
          if ! command -v pkg-config >/dev/null ||
             ! pkg-config --exists liblzma libzstd; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 update
            sudo apt-get install --yes --no-install-recommends liblzma-dev libzstd-dev
          fi
      - name: Build and test
        run: |
          zig build -Doptimize="$OPTIMIZE" -j2 --summary all
          zig build test -Doptimize="$OPTIMIZE" -j2 --summary all
          zig build fuzz -Doptimize="$OPTIMIZE" -j2 --summary all
      - name: Test release packaging
        if: ${{ matrix.optimize == 'Debug' }}
        run: zig build test-release -j2 --summary all
      - name: Check ReleaseSafe CLI help
        if: ${{ matrix.optimize == 'ReleaseSafe' }}
        run: zig build -Doptimize=ReleaseSafe -j2 run -- --help
      - name: Compare native materialization, conffiles, differential, lifecycle, and triggers with dpkg
        run: |
          reference_dpkg="$(python3 tools/prepare-native-dpkg.py)"
          zig build test-native-materialization test-native-conffiles test-native-differential test-native-lifecycle test-native-triggers \
            -Dnative-reference-dpkg="$reference_dpkg" -Doptimize="$OPTIMIZE" -j2 --summary all
      - name: Require private native helper namespaces
        run: |
          zig build test-native-helper-namespace -Doptimize="$OPTIMIZE" -j2 --summary all
      - name: Run required real apt facade acceptance
        run: |
          sudo env \
            PATH="$PATH" \
            TMPDIR="$PWD/.zig-cache" \
            PYTHONPYCACHEPREFIX="$PWD/.zig-cache/pycache" \
            ZIG_GLOBAL_CACHE_DIR="$PWD/.zig-cache/apt-system-acceptance-global" \
            ZIG_LOCAL_CACHE_DIR="$PWD/.zig-cache/apt-system-acceptance-local" \
            "$(command -v zig)" build test-apt-system-acceptance \
              -Doptimize="$OPTIMIZE" -j2 --summary all
      - name: Normalize apt facade acceptance diagnostics
        if: ${{ always() }}
        run: |
          sudo chown -R "$USER:$USER" \
            .zig-cache/apt-system-acceptance-global \
            .zig-cache/apt-system-acceptance-local 2>/dev/null || true
      - name: Run required privileged orchestration crash suite
        if: ${{ matrix.optimize == 'Debug' }}
        run: |
          sudo rm -rf /run/debz
          sudo env \
            ZIG_GLOBAL_CACHE_DIR="$PWD/.zig-global-cache-orchestration-required" \
            ZIG_LOCAL_CACHE_DIR="$PWD/.zig-cache-orchestration-required" \
            "$(command -v zig)" build test-apt-system \
              -Drequire-privileged-orchestration-tests=true \
              -j2 --summary all
      - name: Normalize privileged orchestration diagnostics
        if: ${{ always() && matrix.optimize == 'Debug' }}
        run: |
          sudo chown -R "$USER:$USER" \
            .zig-cache-orchestration-required \
            .zig-global-cache-orchestration-required 2>/dev/null || true
          sudo rm -rf /run/debz
      - name: Prepare native download action fixture
        if: ${{ matrix.optimize == 'ReleaseSafe' }}
        id: download-fixture
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          workspace="$PWD/.zig-cache/download-native"
          mkdir -p "$workspace/root" "$workspace/metadata" "$workspace/state"
          python3 tools/generate-integration-repository.py \
            --output "$workspace/repository" --suite debian-stable \
            --architecture "$ARCHITECTURE"
          cat >"$workspace/fixture.sources" <<EOF
          Types: deb
          URIs: file://$workspace/repository
          Suites: debian-stable
          Components: main
          Architectures: $ARCHITECTURE
          Signed-By: $workspace/repository/fixture-keyring.gpg
          EOF
          zig-out/bin/debz plan \
            --install-root "$workspace/root" \
            --cache-path "$workspace/metadata" \
            --state-path "$workspace/state" \
            --architecture "$ARCHITECTURE" \
            --source "$workspace/fixture.sources" \
            --keyring "$workspace/repository/fixture-keyring.gpg" \
            --lock-output "$workspace/lock.json" scenario-main --json >/dev/null
          printf 'source=%s\nkeyring=%s\nlock=%s\n' \
            "$workspace/fixture.sources" \
            "$workspace/repository/fixture-keyring.gpg" \
            "$workspace/lock.json" >>"$GITHUB_OUTPUT"
          printf '%s\n' "$PWD/zig-out/bin" >>"$GITHUB_PATH"
      - name: Prepare native exact-lock package closure
        if: ${{ matrix.optimize == 'ReleaseSafe' }}
        id: download
        uses: ./actions/download
        with:
          lock-input: ${{ steps.download-fixture.outputs.lock }}
          source: ${{ steps.download-fixture.outputs.source }}
          keyring: ${{ steps.download-fixture.outputs.keyring }}
          architecture: ${{ matrix.architecture }}
          cache: 'false'
      - name: Validate native download action outputs
        if: ${{ matrix.optimize == 'ReleaseSafe' }}
        env:
          CACHE_HIT: ${{ steps.download.outputs.cache-hit }}
          CACHE_PATH: ${{ steps.download.outputs.cache-path }}
          DOWNLOADED: ${{ steps.download.outputs.downloaded-count }}
          REUSED: ${{ steps.download.outputs.reused-count }}
        run: |
          test "$CACHE_HIT" = false
          test -d "$CACHE_PATH"
          test "$DOWNLOADED" -gt 0
          test "$REUSED" -eq 0

  native-recovery:
    name: Native crash recovery (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Install metadata decompression dependency
        run: |
          if ! command -v pkg-config >/dev/null ||
             ! pkg-config --exists liblzma libzstd; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 update
            sudo apt-get install --yes --no-install-recommends liblzma-dev libzstd-dev
          fi
      - name: Exercise native recovery and signed-suite consumer parity
        run: |
          reference_dpkg="$(python3 tools/prepare-native-dpkg.py)"
          zig build test-native-recovery -Dnative-reference-dpkg="$reference_dpkg" -j2 --summary all
          zig build test-native-recovery -Dnative-reference-dpkg="$reference_dpkg" -Doptimize=ReleaseSafe -j2 --summary all

  arm64-dpkg-oracles:
    if: github.event_name == 'workflow_dispatch' && inputs.run_arm64_dpkg_oracles
    name: Pinned dpkg 1.22.22 ARM64 oracles
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bind source and runner architecture
        env:
          EXPECTED_INVOCATION_CLOCK: "2026-09-20T16:29:21.965+00:00"
        run: |
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = issue-86-arm64-oracles
          test "$EXPECTED_INVOCATION_CLOCK" = "2026-09-20T16:29:21.965+00:00"
      - name: Prepare digest-verified private ARM64 tools
        run: |
          reference_dpkg="$(python3 tools/prepare-native-dpkg.py --architecture arm64)"
          reference_prefix="$(dirname "$(dirname "$reference_dpkg")")"
          test "$reference_dpkg" = "$PWD/.cache/native-dpkg-reference/1.22.22/arm64/usr/bin/dpkg"
          test -x "$reference_prefix/bin/update-alternatives"
          test -f "$PWD/.cache/native-dpkg-reference/1.22.22/arm64/reference-receipt-v1.json"
      - name: Execute bounded ARM64 references
        run: |
          output="$PWD/.tmp/arm64-dpkg-oracles"
          reference="$PWD/.cache/native-dpkg-reference/1.22.22/arm64/usr/bin"
          mkdir -p "$output/host-config/dpkg.cfg.d"
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location(
              "debz_config_reference",
              Path("tools/dpkg-config-reference.py"),
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path(".tmp/arm64-dpkg-oracles/host-config/dpkg.cfg").write_bytes(
              module.PINNED_DPKG_CONFIG
          )
          PY
          if ! sudo -n /usr/bin/unshare --mount --propagation private \
            /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            LANG=C \
            LC_ALL=C \
            PYTHONDONTWRITEBYTECODE=1 \
            TMPDIR="$PWD/.tmp" \
            XDG_CACHE_HOME="$PWD/.cache" \
            /bin/sh tools/run-dpkg-oracle-isolated.sh \
              "$PWD" config arm64 "$reference/dpkg" \
              "$output/dpkg-config-reference-arm64-observed-v1.json" \
              >"$output/config.stdout" 2>"$output/config.stderr"; then
            sed -n '1,160p' "$output/config.stderr"
            exit 1
          fi
          if ! sudo -n /usr/bin/unshare --mount --propagation private \
            /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            LANG=C \
            LC_ALL=C \
            PYTHONDONTWRITEBYTECODE=1 \
            TMPDIR="$PWD/.tmp" \
            XDG_CACHE_HOME="$PWD/.cache" \
            /bin/sh tools/run-dpkg-oracle-isolated.sh \
              "$PWD" alternatives arm64 "$reference/dpkg" \
              "$output/dpkg-alternatives-reference-arm64-observed-v1.json" \
              "$reference/update-alternatives" \
              >"$output/alternatives.stdout" 2>"$output/alternatives.stderr"; then
            sed -n '1,160p' "$output/alternatives.stderr"
            exit 1
          fi
          sudo chown -R "$USER:$USER" "$output"
      - name: Bind and validate canonical evidence
        env:
          INVOCATION_CLOCK: "2026-09-20T16:29:21.965+00:00"
        run: |
          output="$PWD/.tmp/arm64-dpkg-oracles"
          reference="$PWD/.cache/native-dpkg-reference/1.22.22/arm64/usr/bin"
          python3 tools/dpkg-oracle-evidence.py create \
            --architecture arm64 \
            --source-commit "$GITHUB_SHA" \
            --invocation-clock "$INVOCATION_CLOCK" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job "$GITHUB_JOB" \
            --runner-label ubuntu-24.04-arm \
            --runner-arch "$RUNNER_ARCH" \
            --machine aarch64 \
            --dpkg "$reference/dpkg" \
            --update-alternatives "$reference/update-alternatives" \
            --receipt \
              "$PWD/.cache/native-dpkg-reference/1.22.22/arm64/reference-receipt-v1.json" \
            --config-observation \
              "$output/dpkg-config-reference-arm64-observed-v1.json" \
            --config-stdout "$output/config.stdout" \
            --config-stderr "$output/config.stderr" \
            --alternatives-observation \
              "$output/dpkg-alternatives-reference-arm64-observed-v1.json" \
            --alternatives-stdout "$output/alternatives.stdout" \
            --alternatives-stderr "$output/alternatives.stderr" \
            --output "$output/dpkg-oracle-execution-evidence-arm64-v1.json"
          python3 tools/dpkg-oracle-evidence.py verify \
            --evidence "$output/dpkg-oracle-execution-evidence-arm64-v1.json" \
            --artifact-root "$output"
          python3 -m unittest \
            tools/test_dpkg_config_reference.py \
            tools/test_dpkg_alternatives_reference.py \
            tools/test_dpkg_oracle_evidence.py
      - name: Upload canonical ARM64 oracle evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dpkg-oracle-execution-evidence-arm64-${{ github.sha }}
          path: |
            .tmp/arm64-dpkg-oracles/dpkg-config-reference-arm64-observed-v1.json
            .tmp/arm64-dpkg-oracles/dpkg-alternatives-reference-arm64-observed-v1.json
            .tmp/arm64-dpkg-oracles/dpkg-oracle-execution-evidence-arm64-v1.json
          if-no-files-found: error
          retention-days: 14

  build-and-test:
    name: Build and test (${{ matrix.name }})
    needs: [build-and-test-workload, native-recovery]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        name: [linux-x64, linux-arm64]
    steps:
      - name: Require every build and native recovery workload
        env:
          BUILD_RESULT: ${{ needs.build-and-test-workload.result }}
          RECOVERY_RESULT: ${{ needs.native-recovery.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$RECOVERY_RESULT" = success

  security-audit:
    name: Security and dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Install audited system dependency
        run: |
          if ! command -v pkg-config >/dev/null ||
             ! pkg-config --exists liblzma libzstd ||
             ! python3 -c 'import jsonschema' 2>/dev/null; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 update
            sudo apt-get install --yes --no-install-recommends \
              liblzma-dev libzstd-dev pkg-config python3-jsonschema
          fi
      - name: Test real acceptance input validation
        run: |
          tools/real-snapshot-acceptance.sh --validate-values \
            https://snapshot.ubuntu.com/ubuntu/20260923T000000Z stonking amd64
          ! tools/real-snapshot-acceptance.sh --validate-values \
            https://example.invalid stonking amd64
      - name: Run static security audit
        run: zig build security-audit

  release-dry-run:
    name: Required release dry-run (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-linux-musl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Build, package, and audit v0.3.0 binary assets
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          zon_version=$(python3 -c 'import pathlib,re; text=pathlib.Path("build.zig.zon").read_text(); match=re.search(r"(?m)^\s*\.version\s*=\s*\"([^\"]+)\"", text); assert match; print(match.group(1))')
          version=$(python3 tools/release.py version v0.3.0 --expect "zon=$zon_version")
          zig build -Dtarget="$TARGET" -Doptimize=ReleaseSafe -Dversion="$version" release-install \
            --prefix "$PWD/.zig-cache/release-install"
          python3 tools/release.py version v0.3.0 --expect "zon=$zon_version" \
            --expect "binary=$(.zig-cache/release-install/bin/debz version)"
          epoch=$(git show -s --format=%ct HEAD)
          python3 tools/release.py binary --tag v0.3.0 --platform "$PLATFORM" \
            --prefix .zig-cache/release-install --epoch "$epoch" \
            --output release-assets
          for format in tar.gz tar.xz; do
            python3 tools/release.py audit --tag v0.3.0 \
              --platform "$PLATFORM" \
              --archive "release-assets/debz-0.3.0-$PLATFORM.$format" --smoke
          done
      - name: Upload dry-run binary assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run-${{ matrix.platform }}
          path: |
            release-assets/debz-0.3.0-${{ matrix.platform }}.tar.gz
            release-assets/debz-0.3.0-${{ matrix.platform }}.tar.xz
          if-no-files-found: error
          retention-days: 1

  release-dry-run-verify:
    name: Required release dry-run exact verification
    needs: release-dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download merged dry-run assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-dry-run-*
          path: release-assets
          merge-multiple: true
      - name: Verify exact four-archive dry-run
        run: |
          python3 tools/release.py verify --tag v0.3.0 \
            --assets release-assets --smoke

  release-policy:
    name: Required release workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Audit release workflow policy
        run: tools/release-workflow-policy.py

  fuzz:
    name: Bounded mutation fuzzing (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Install metadata decompression dependency
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo apt-get install --yes --no-install-recommends liblzma-dev libzstd-dev
      - name: Run bounded fuzz campaign
        run: zig build fuzz -Dfuzz-cases=${{ github.event_name == 'schedule' && '5000' || '128' }}

  integration-required:
    name: Required disposable root (${{ matrix.suite }}/${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: debian-stable
            architecture: amd64
            runner: ubuntu-24.04
          - suite: ubuntu-26.04
            architecture: amd64
            runner: ubuntu-24.04
          - suite: debian-stable
            architecture: arm64
            runner: ubuntu-24.04-arm
          - suite: ubuntu-26.04
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Install bounded fixture prerequisites
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo apt-get install --yes --no-install-recommends dpkg liblzma-dev libzstd-dev python3-cryptography
      - name: Run required integration root
        env:
          DEBZ_INTEGRATION_SUITE: ${{ matrix.suite }}
          DEBZ_INTEGRATION_ARCH: ${{ matrix.architecture }}
          DEBZ_INTEGRATION_MODE: full
          DEBZ_INTEGRATION_SUDO: "1"
        run: zig build test-integration
      - name: Normalize diagnostic ownership
        if: always()
        run: sudo chown -R "$USER:$USER" ".zig-cache/integration-${{ matrix.suite }}-${{ matrix.architecture }}" || true
      - name: Upload root diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-required-${{ matrix.suite }}-${{ matrix.architecture }}
          path: .zig-cache/integration-${{ matrix.suite }}-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 7

  integration-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Full disposable root (${{ matrix.suite }}/${{ matrix.architecture }}/${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: debian-stable
            architecture: arm64
            runner: ubuntu-24.04
          - suite: ubuntu-26.04
            architecture: arm64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Install bounded fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg liblzma-dev libzstd-dev python3-cryptography
      - name: Run full integration root
        env:
          DEBZ_INTEGRATION_SUITE: ${{ matrix.suite }}
          DEBZ_INTEGRATION_ARCH: ${{ matrix.architecture }}
          DEBZ_INTEGRATION_MODE: full
          DEBZ_INTEGRATION_SUDO: "1"
        run: zig build test-integration
      - name: Normalize diagnostic ownership
        if: always()
        run: sudo chown -R "$USER:$USER" ".zig-cache/integration-${{ matrix.suite }}-${{ matrix.architecture }}" || true
      - name: Upload root diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-${{ matrix.suite }}-${{ matrix.architecture }}-${{ matrix.runner }}
          path: .zig-cache/integration-${{ matrix.suite }}-${{ matrix.architecture }}/
          if-no-files-found: ignore
          retention-days: 7

  ubuntu-real-snapshot:
    if: github.event_name == 'workflow_dispatch' && inputs.run_native_real_snapshot
    name: Native Ubuntu snapshot (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate pinned native acceptance inputs
        env:
          SNAPSHOT_URI: ${{ inputs.ubuntu_snapshot_uri }}
          SNAPSHOT_SUITE: ${{ inputs.ubuntu_snapshot_suite }}
        run: |
          tools/real-snapshot-acceptance.sh --validate \
            "$SNAPSHOT_URI" "$SNAPSHOT_SUITE" "${{ matrix.architecture }}"
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Install test runner prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dpkg jq liblzma-dev libzstd-dev strace
      - name: Build native candidate and Zig comparator
        run: |
          zig build -Doptimize=ReleaseSafe -j2
          zig build test-real-snapshot-comparator -Doptimize=ReleaseSafe -j2
      - name: Prepare pinned isolated dpkg oracle
        id: reference
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          reference_dpkg="$(python3 tools/prepare-native-dpkg.py \
            --architecture "$ARCHITECTURE")"
          printf 'dpkg=%s\n' "$reference_dpkg" >>"$GITHUB_OUTPUT"
      - name: Create and replay exact native Ubuntu root
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          REFERENCE_DPKG: ${{ steps.reference.outputs.dpkg }}
          SNAPSHOT_URI: ${{ inputs.ubuntu_snapshot_uri }}
          SNAPSHOT_SUITE: ${{ inputs.ubuntu_snapshot_suite }}
        run: |
          sudo --preserve-env=ARCHITECTURE,GITHUB_JOB,GITHUB_RUN_ATTEMPT,GITHUB_RUN_ID,GITHUB_SHA,GITHUB_WORKFLOW,REFERENCE_DPKG,SNAPSHOT_SUITE,SNAPSHOT_URI \
            env DEBZ_REAL_SNAPSHOT_TRACE=1 \
            tools/real-snapshot-acceptance.sh "$PWD/zig-out/bin/debz" \
            "$SNAPSHOT_URI" "$SNAPSHOT_SUITE" "$ARCHITECTURE" \
            "$PWD/.real-snapshot/$ARCHITECTURE"
      - name: Install exact closure with pinned dpkg reference
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          REFERENCE_DPKG: ${{ steps.reference.outputs.dpkg }}
        run: |
          sudo --preserve-env=ARCHITECTURE,REFERENCE_DPKG \
            tools/real-snapshot-reference.sh "$REFERENCE_DPKG" \
            "$PWD/.real-snapshot/$ARCHITECTURE/evidence/ubuntu-minimal.lock.json" \
            "$PWD/.real-snapshot/$ARCHITECTURE/cache" "$ARCHITECTURE" \
            "$PWD/.real-snapshot/$ARCHITECTURE"
      - name: Collect diagnostics and clean staged payloads
        if: always()
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          REFERENCE_DPKG: ${{ steps.reference.outputs.dpkg }}
        run: |
          set -euo pipefail
          work=".real-snapshot/$ARCHITECTURE"
          evidence="$work/evidence"
          manifest="$work/evidence/vendor-state-inventory-v1.json"
          sudo mkdir -p "$evidence"
          sudo chown "$USER:$USER" .real-snapshot "$work" "$evidence"
          if [ -n "$REFERENCE_DPKG" ] && [ -f "$REFERENCE_DPKG" ]; then
            reference_prefix="$(dirname "$(dirname "$(dirname "$REFERENCE_DPKG")")")"
            sudo cp "$REFERENCE_DPKG" "$evidence/reference-dpkg"
            sudo cp "$reference_prefix/reference-receipt-v1.json" \
              "$evidence/reference-receipt-v1.json"
            if [ -f "$(dirname "$REFERENCE_DPKG")/dpkg-deb" ]; then
              sudo cp "$(dirname "$REFERENCE_DPKG")/dpkg-deb" \
                "$evidence/reference-dpkg-deb"
            fi
          fi
          capture_status=0
          if [ -d "$work/root/var/lib/dpkg/info" ]; then
            sudo python3 tools/capture-vendor-state.py \
              --reference-root "$PWD/$work/root" \
              --architecture "$ARCHITECTURE" \
              --output "$PWD/$manifest" \
              || capture_status=$?
            if [ "$capture_status" -eq 0 ]; then
              sudo chown "$USER:$USER" "$manifest" || capture_status=$?
            fi
          else
            printf 'captured=false\nreason=no-candidate-dpkg-database\n' |
              sudo tee "$evidence/vendor-state-capture-skipped.txt" >/dev/null
          fi
          differential_status=0
          sudo zig-out/bin/native-differential capture \
            --root "$PWD/$work/root" \
            --exclude dev/null \
            --output "$PWD/$evidence/native.snapshot.json" \
            || differential_status=$?
          if [ -f "$evidence/reference.snapshot.json" ] &&
             [ -f "$evidence/native.snapshot.json" ]; then
            sudo zig-out/bin/real-snapshot-comparator compare \
              "$PWD/$evidence/reference.snapshot.json" \
              "$PWD/$evidence/native.snapshot.json" \
              "$PWD/$evidence/comparison-summary-v1.json" \
              || differential_status=$?
          else
            differential_status=1
            printf 'compared=false\nreference_snapshot_present=%s\nnative_snapshot_present=%s\n' \
              "$([ -f "$evidence/reference.snapshot.json" ] && echo true || echo false)" \
              "$([ -f "$evidence/native.snapshot.json" ] && echo true || echo false)" |
              sudo tee "$evidence/comparison-unavailable.txt" >/dev/null
          fi
          if [ -f "$evidence/refresh.json" ]; then
            sudo jq '{
              operation,
              exit_status,
              changed,
              summary,
              diagnostics
            }' "$evidence/refresh.json" |
              sudo tee "$evidence/acceptance-outcome-v1.json" >/dev/null
          fi
          sudo chown -R "$USER:$USER" "$evidence"
          forbidden_exec_status=0
          if grep -Eh 'execve\("([^"]*/)?dpkg(-deb)?"|execveat\([^,]+, "([^"]*/)?dpkg(-deb)?"|execveat\([^,]*</[^>]+/dpkg(-deb)?>, ""' \
            "$evidence"/*.execve >"$evidence/forbidden-exec.txt" 2>/dev/null; then
            forbidden_exec_status=1
          else
            rm -f "$evidence/forbidden-exec.txt"
          fi
          sudo cp -a "$work/state/." "$work/evidence/state/" 2>/dev/null || true
          sudo cp "$work/root/var/lib/dpkg/status" "$work/evidence/status-final" 2>/dev/null || true
          sudo cp "$work/ubuntu.sources" "$work/evidence/" 2>/dev/null || true
          sudo cp "$work/ubuntu.json" "$work/evidence/" 2>/dev/null || true
          sudo du -sh "$work" 2>/dev/null \
            | sudo tee "$work/evidence/disk-usage-final.txt" >/dev/null || true
          sudo chown -R "$USER:$USER" "$evidence"
          oversized=$(find "$evidence" -type f -size +128M -print -quit)
          if [ -n "$oversized" ]; then
            echo "one evidence member exceeds 128 MiB: $oversized" >&2
            exit 1
          fi
          read -r bytes _ < <(du -sb "$evidence")
          test "$bytes" -le $((512 * 1024 * 1024))
          printf 'artifact=ubuntu-real-snapshot-%s\nbytes_before_index=%s\n' \
            "$ARCHITECTURE" "$bytes" >"$evidence/artifact-summary.txt"
          (
            cd "$evidence"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum >SHA256SUMS
          )
          cleanup_status=0
          sudo rm -rf "$work/root" "$work/cache" || cleanup_status=$?
          sudo rm -rf "$work/reference-root" || cleanup_status=$?
          ownership_status=0
          sudo chown -R "$USER:$USER" .real-snapshot || ownership_status=$?
          if [ "$capture_status" -ne 0 ]; then
            exit "$capture_status"
          fi
          if [ "$differential_status" -ne 0 ]; then
            exit "$differential_status"
          fi
          if [ "$forbidden_exec_status" -ne 0 ]; then
            exit "$forbidden_exec_status"
          fi
          if [ "$cleanup_status" -ne 0 ]; then
            exit "$cleanup_status"
          fi
          exit "$ownership_status"
      - name: Upload real acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-real-snapshot-${{ matrix.architecture }}
          path: .real-snapshot/${{ matrix.architecture }}/evidence/
          if-no-files-found: error
          retention-days: 14
