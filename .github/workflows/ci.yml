          persist-credentials: false
      - name: Download merged dry-run assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-dry-run-*
          path: release-assets
          merge-multiple: true
      - name: Verify exact four-archive dry-run
        run: |
          python3 tools/release.py verify --tag v0.3.0 \
            --assets release-assets --smoke

  release-policy:
    name: Required release workflow policy
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
