  ubuntu-real-snapshot:
    if: github.event_name == 'workflow_dispatch' && inputs.run_native_real_snapshot
    name: Native Ubuntu snapshot (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    # Protected setup 20, native wrapper 220 (install ceiling 180), reference
    # 50 and diagnostics 15, leaving 15 for bounded export/upload/cleanup.
    timeout-minutes: 320
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      PROTECTED_TREE: /srv/debz-protected/native-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate pinned native acceptance inputs
        env:
          SNAPSHOT_URI: ${{ inputs.ubuntu_snapshot_uri }}
          SNAPSHOT_SUITE: ${{ inputs.ubuntu_snapshot_suite }}
        run: |
          tools/real-snapshot-acceptance.sh --validate-values \
            "$SNAPSHOT_URI" "$SNAPSHOT_SUITE" "${{ matrix.architecture }}"
      - name: Install test runner prerequisites
        run: |
          sudo -n apt-get update
          sudo -n apt-get install --yes --no-install-recommends \
            dpkg jq liblzma-dev libzstd-dev strace
      - name: Stage protected native checkout, toolchain, dpkg and trust root
        timeout-minutes: 20
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          bundle="$PWD/.native-protected-$ARCHITECTURE.bundle"
          git bundle create "$bundle" HEAD
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LC_ALL=C \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
            bash -euo pipefail -c '
            tree=$1 architecture=$2 expected=$3 bundle=$4
            [[ $tree =~ ^/srv/debz-protected/native-ci-[0-9]+-[0-9]+-(amd64|arm64)$ ]]
            [[ ${BASH_REMATCH[1]} == "$architecture" && $expected =~ ^[0-9a-f]{40}$ ]]
            umask 022
            [[ -e /srv/debz-protected ]] || mkdir -m 0755 /srv/debz-protected
            for ancestor in / /srv /srv/debz-protected; do
              [[ -d $ancestor && ! -L $ancestor && $(stat -c %u:%g "$ancestor") == 0:0 ]]
              (( ($(stat -c 0%a "$ancestor") & 022) == 0 ))
            done
            mkdir -m 0700 -- "$tree"
            install -o root -g root -m 0600 -- "$bundle" "$tree/debz.bundle"
            git init --quiet --bare "$tree/bare.git"
            printf "%s\n" "$expected" >"$tree/bare.git/shallow"
            git --git-dir="$tree/bare.git" bundle verify "$tree/debz.bundle"
            git --git-dir="$tree/bare.git" fetch --quiet "$tree/debz.bundle" HEAD:refs/heads/protected
            test "$(git --git-dir="$tree/bare.git" rev-parse refs/heads/protected)" = "$expected"
            git --git-dir="$tree/bare.git" symbolic-ref HEAD refs/heads/protected
            git --git-dir="$tree/bare.git" fsck --full --no-dangling
            git clone --quiet --no-hardlinks "file://$tree/bare.git" "$tree/checkout"
            test "$(git -C "$tree/checkout" rev-parse HEAD)" = "$expected"
            exec bash "$tree/checkout/tools/real-snapshot-reference-protected-ci.sh" --stage-native "$tree" "$architecture" "$expected"
            ' native-protected-bootstrap "$PROTECTED_TREE" "$ARCHITECTURE" "$GITHUB_SHA" "$bundle"
      - name: Create and replay exact native Ubuntu root
        id: native
        timeout-minutes: 220
        env:
          SNAPSHOT_URI: ${{ inputs.ubuntu_snapshot_uri }}
          SNAPSHOT_SUITE: ${{ inputs.ubuntu_snapshot_suite }}
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LC_ALL=C \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            GITHUB_WORKFLOW="$GITHUB_WORKFLOW" \
            bash "$PROTECTED_TREE/checkout/tools/real-snapshot-protected-native-ci.sh" \
            native "$PROTECTED_TREE" "$ARCHITECTURE" "$GITHUB_SHA" "$SNAPSHOT_URI" "$SNAPSHOT_SUITE"
      - name: Install exact closure with pinned dpkg reference
        timeout-minutes: 50
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LC_ALL=C \
            bash "$PROTECTED_TREE/checkout/tools/real-snapshot-protected-native-ci.sh" \
            reference "$PROTECTED_TREE" "$ARCHITECTURE" "$GITHUB_SHA"
      - name: Collect bounded protected native diagnostics
        if: always()
        timeout-minutes: 15
        env:
          NATIVE_STEP_OUTCOME: ${{ steps.native.outcome }}
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LC_ALL=C \
            NATIVE_STEP_OUTCOME="$NATIVE_STEP_OUTCOME" \
            bash "$PROTECTED_TREE/checkout/tools/real-snapshot-protected-native-ci.sh" \
            collect "$PROTECTED_TREE" "$ARCHITECTURE" "$GITHUB_SHA"
      - name: Copy bounded native evidence
        if: always()
        run: |
          set -euo pipefail
          output="$PWD/.real-snapshot/$ARCHITECTURE/evidence"
          mkdir -p "$output"
          if sudo -n test -d "$PROTECTED_TREE/native-upload"; then
            read -r bytes _ < <(sudo -n du -sb "$PROTECTED_TREE/native-upload")
            test "$bytes" -le $((512 * 1024 * 1024))
            sudo -n tar -C "$PROTECTED_TREE/native-upload" -cf - . >"$PWD/.native-evidence.tar"
            tar --no-same-owner --no-same-permissions -C "$output" -xf "$PWD/.native-evidence.tar"
          else
            printf 'native_evidence=unavailable\nreason=protected-setup-or-export-failed\n' >"$output/collection-failure.txt"
            if sudo -n test -d "$PROTECTED_TREE/upload"; then
              mkdir -p "$output/staging"
              sudo -n tar -C "$PROTECTED_TREE/upload" -cf - . >"$PWD/.native-staging-evidence.tar"
              tar --no-same-owner --no-same-permissions -C "$output/staging" -xf "$PWD/.native-staging-evidence.tar"
            fi
          fi
          if [ -f "$output/exec-reaudit-summary.txt" ]; then
            cat "$output/exec-reaudit-summary.txt" >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Kill native descendants and remove only the named tree
        if: always()
        timeout-minutes: 3
        run: |
          set -euo pipefail
          output="$PWD/.real-snapshot/$ARCHITECTURE/evidence"
          mkdir -p "$output"
          status=0
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C bash -euo pipefail -c '
            tree=$1
            [[ $tree =~ ^/srv/debz-protected/native-ci-[0-9]+-[0-9]+-(amd64|arm64)$ ]]
            [[ -e $tree || -L $tree ]] || exit 0
            [[ -d $tree && ! -L $tree && $(stat -c %u:%g "$tree") == 0:0 ]]
            for attempt in 1 2 3 4 5; do
              victims=()
              for process in /proc/[0-9]*; do
                root=$(readlink "$process/root" 2>/dev/null) || continue
                cwd=$(readlink "$process/cwd" 2>/dev/null) || cwd=
                case "$root/ $cwd/" in
                  *"$tree/"*) victims+=("${process#/proc/}") ;;
                esac
              done
              (( ${#victims[@]} )) || break
              echo "killing named native descendants: ${victims[*]}"
              kill -KILL "${victims[@]}" 2>/dev/null || true
              sleep 1
            done
            (( ${#victims[@]} == 0 ))
            if grep -F " $tree" /proc/self/mountinfo; then
              echo "mounts remain beneath $tree" >&2
              exit 1
            fi
            rm -rf --one-file-system -- "$tree"
            test ! -e "$tree"
            ' native-protected-cleanup "$PROTECTED_TREE" >"$output/cleanup-result.txt" 2>&1 || status=$?
          printf 'cleanup_status=%s\n' "$status" >>"$output/cleanup-result.txt"
          (
            cd "$output"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 -r sha256sum >SHA256SUMS
          )
          exit "$status"
      - name: Upload real acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-real-snapshot-${{ matrix.architecture }}
          path: .real-snapshot/${{ matrix.architecture }}/evidence/
          if-no-files-found: error
          retention-days: 14

  protected-reference:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_protected_reference)
    name: Protected pinned-dpkg reference (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
