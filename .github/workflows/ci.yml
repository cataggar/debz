name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ubuntu_snapshot_uri:
        description: "Pinned immutable Ubuntu snapshot URI"
        required: true
        type: string
        default: "https://snapshot.ubuntu.com/ubuntu/20260816T000000Z"
      ubuntu_snapshot_suite:
        description: "Pinned snapshot suite/codename"
        required: true
        type: string
        default: "resolute"
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  attestations: read

jobs:
  setup-action-unit:
    name: Setup action unit and bundle checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Test and reproduce setup action bundles
        run: |
          npm --prefix actions/setup ci
          npm --prefix actions/setup audit --audit-level=high
          npm --prefix actions/setup test
          npm --prefix actions/setup run bundle
          git diff --exit-code -- actions/setup/dist

  setup-action-native:
    name: Setup action native (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            digest: 80c63abc6ba357733440de57b1f93441b1ac32d6a65da7dbfca4ccb78e1935ae
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            digest: 02833d0967790b309e0381a97f9b8e915549578fa60e0fdd0ff8a2b62ef1db6e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install v0.2.0 with GitHub provenance
        id: setup-provenance
        uses: ./actions/setup
        with:
          debz-version: v0.2.0
          cache: 'true'
      - name: Validate provenance installation
        env:
          CACHE_HIT: ${{ steps.setup-provenance.outputs.cache-hit }}
          DEBZ_PATH: ${{ steps.setup-provenance.outputs.debz-path }}
          DEBZ_VERSION: ${{ steps.setup-provenance.outputs.debz-version }}
          EXPECTED_TARGET: ${{ matrix.target }}
          TARGET: ${{ steps.setup-provenance.outputs.target }}
        run: |
          test -x "$DEBZ_PATH"
          test "$DEBZ_VERSION" = v0.2.0
          test "$TARGET" = "$EXPECTED_TARGET"
          case "$CACHE_HIT" in true|false) ;; *) exit 1 ;; esac
          test "$("$DEBZ_PATH" --version)" = 0.2.0
          "$DEBZ_PATH" --help >/dev/null
      - name: Install v0.2.0 with explicit trusted SHA-256
        id: setup-sha
        uses: ./actions/setup
        with:
          debz-version: v0.2.0
          sha256: ${{ matrix.digest }}
          cache: 'false'
      - name: Validate trusted-SHA installation
        env:
          DEBZ_PATH: ${{ steps.setup-sha.outputs.debz-path }}
          DEBZ_VERSION: ${{ steps.setup-sha.outputs.debz-version }}
          EXPECTED_TARGET: ${{ matrix.target }}
          TARGET: ${{ steps.setup-sha.outputs.target }}
        run: |
          test -x "$DEBZ_PATH"
          test "$DEBZ_VERSION" = v0.2.0
          test "$TARGET" = "$EXPECTED_TARGET"
          test "$("$DEBZ_PATH" --version)" = 0.2.0

  setup-action-container:
    name: Setup action in bare Ubuntu container
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm optional host tools are absent
        shell: sh
        run: |
          ! command -v python3
          ! command -v pipx
          ! command -v curl
          ! command -v gh
      - name: Install v0.2.0 without host download or archive tools
        id: setup
        uses: ./actions/setup
        with:
          debz-version: v0.2.0
          cache: 'false'
      - name: Validate clean-container installation
        shell: sh
        env:
          DEBZ_PATH: ${{ steps.setup.outputs.debz-path }}
          DEBZ_VERSION: ${{ steps.setup.outputs.debz-version }}
          TARGET: ${{ steps.setup.outputs.target }}
        run: |
          test -x "$DEBZ_PATH"
          test "$DEBZ_VERSION" = v0.2.0
          test "$TARGET" = linux-x64
          test "$("$DEBZ_PATH" --version)" = 0.2.0

  download-action-unit:
    name: Download action unit and bundle checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Test and reproduce download action bundle
        run: |
          npm --prefix actions/download ci
          npm --prefix actions/download audit --audit-level=high
          npm --prefix actions/download test
          npm --prefix actions/download run bundle
          git diff --exit-code -- actions/download/dist

  install-action-unit:
    name: Install action unit and bundle checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Test and reproduce install action bundle
        run: |
          npm --prefix actions/install ci
          npm --prefix actions/install audit --audit-level=high
          npm --prefix actions/install test
          npm --prefix actions/install run bundle
          git diff --exit-code -- actions/install/dist

  install-action-native:
    name: Install action native transaction (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Build CLI and action test runtime
        run: |
          zig build -Doptimize=ReleaseSafe
          npm --prefix actions/install ci
          npm --prefix actions/install run build
      - name: Create signed exact-lock fixture
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          workspace="$PWD/.zig-cache/install-action-native"
          mkdir -p "$workspace/plan-root" "$workspace/plan-cache" "$workspace/plan-state"
          python3 tools/generate-integration-repository.py \
            --output "$workspace/repository" --suite debian-stable \
            --architecture "$ARCHITECTURE"
          cat >"$workspace/fixture.sources" <<EOF
          Types: deb
          URIs: file://$workspace/repository
          Suites: debian-stable
          Components: main
          Architectures: $ARCHITECTURE
          Signed-By: $workspace/repository/fixture-keyring.gpg
          EOF
          zig-out/bin/debz plan \
            --install-root "$workspace/plan-root" \
            --cache-path "$workspace/plan-cache" \
            --state-path "$workspace/plan-state" \
            --architecture "$ARCHITECTURE" \
            --source "$workspace/fixture.sources" \
            --keyring "$workspace/repository/fixture-keyring.gpg" \
            --lock-output "$workspace/lock.json" scenario-main --json >/dev/null
          zig-out/bin/debz plan \
            --install-root "$workspace/plan-root" \
            --cache-path "$workspace/plan-cache" \
            --state-path "$workspace/plan-state" \
            --architecture "$ARCHITECTURE" \
            --source "$workspace/fixture.sources" \
            --keyring "$workspace/repository/fixture-keyring.gpg" \
            --lock-output "$workspace/fail.lock.json" fail-script --json >/dev/null
      - name: Exercise cold, warm, offline, and same-root installs
        env:
          DEBZ_INSTALL_INTEGRATION: '1'
          DEBZ_INSTALL_INTEGRATION_SUDO: '1'
          DEBZ_INSTALL_FIXTURE_ROOT: ${{ github.workspace }}/.zig-cache/install-action-native
          DEBZ_INSTALL_CLI: ${{ github.workspace }}/zig-out/bin/debz
          DEBZ_INSTALL_ARCHITECTURE: ${{ matrix.architecture }}
        run: node --test --test-concurrency=1 actions/install/lib/__tests__/integration.test.js
      - name: Normalize install diagnostics
        if: always()
        run: sudo chown -R "$USER:$USER" .zig-cache/install-action-native || true

  download-action-cache:
    name: Download action cache semantics
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Build unique CLI and exact locks
        id: fixture
        env:
          VERSION: 0.3.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe \
            -Dversion="$VERSION"
          workspace="$PWD/.zig-cache/download-action"
          mkdir -p "$workspace/root" "$workspace/metadata" "$workspace/state"
          python3 tools/generate-integration-repository.py \
            --output "$workspace/repository" --suite debian-stable --architecture amd64
          cat >"$workspace/fixture.sources" <<EOF
          Types: deb
          URIs: file://$workspace/repository
          Suites: debian-stable
          Components: main
          Architectures: amd64
          Signed-By: $workspace/repository/fixture-keyring.gpg
          EOF
          common=(
            --install-root "$workspace/root"
            --cache-path "$workspace/metadata"
            --state-path "$workspace/state"
            --architecture amd64
            --source "$workspace/fixture.sources"
            --keyring "$workspace/repository/fixture-keyring.gpg"
            --json
          )
          zig-out/bin/debz plan "${common[@]}" \
            --lock-output "$workspace/base.lock.json" base-dep >/dev/null
          zig-out/bin/debz plan "${common[@]}" \
            --lock-output "$workspace/scenario.lock.json" scenario-main >/dev/null
          printf 'workspace=%s\nsource=%s\nkeyring=%s\nbase_lock=%s\nscenario_lock=%s\n' \
            "$workspace" "$workspace/fixture.sources" \
            "$workspace/repository/fixture-keyring.gpg" \
            "$workspace/base.lock.json" "$workspace/scenario.lock.json" \
            >>"$GITHUB_OUTPUT"
          printf '%s\n' "$PWD/zig-out/bin" >>"$GITHUB_PATH"
      - name: Populate cold exact-lock cache
        id: cold
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.base_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-cold
      - name: Validate cold result
        env:
          CACHE_HIT: ${{ steps.cold.outputs.cache-hit }}
          MATCHED: ${{ steps.cold.outputs.cache-matched-key }}
          DOWNLOADED: ${{ steps.cold.outputs.downloaded-count }}
          REUSED: ${{ steps.cold.outputs.reused-count }}
        run: |
          test "$CACHE_HIT" = false
          test -z "$MATCHED"
          test "$DOWNLOADED" -gt 0
          test "$REUSED" -eq 0
      - name: Restore compatible partial cache
        id: partial
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-partial
      - name: Validate partial result
        env:
          CACHE_HIT: ${{ steps.partial.outputs.cache-hit }}
          MATCHED: ${{ steps.partial.outputs.cache-matched-key }}
          DOWNLOADED: ${{ steps.partial.outputs.downloaded-count }}
          REUSED: ${{ steps.partial.outputs.reused-count }}
        run: |
          test "$CACHE_HIT" = false
          test -n "$MATCHED"
          test "$DOWNLOADED" -gt 0
          test "$REUSED" -gt 0
      - name: Restore exact completed cache
        id: exact
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-exact
      - name: Validate exact result
        env:
          CACHE_HIT: ${{ steps.exact.outputs.cache-hit }}
          MATCHED: ${{ steps.exact.outputs.cache-matched-key }}
          DOWNLOADED: ${{ steps.exact.outputs.downloaded-count }}
          REUSED: ${{ steps.exact.outputs.reused-count }}
        run: |
          test "$CACHE_HIT" = true
          test -n "$MATCHED"
          test "$DOWNLOADED" -eq 0
          test "$REUSED" -gt 0
      - name: Corrupt one exact-restored object
        run: |
          object=$(find "$RUNNER_TEMP/debz-download-exact/packages-v1/objects" \
            -maxdepth 1 -type f -print -quit)
          test -n "$object"
          printf 'corrupt\n' >"$object"
      - name: Reject corrupt package object
        id: corrupt
        continue-on-error: true
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-exact
          cache: 'false'
          offline: 'true'
      - name: Validate corrupt-object failure
        env:
          CACHE_PATH: ${{ steps.corrupt.outputs.cache-path }}
          OUTCOME: ${{ steps.corrupt.outcome }}
        run: |
          test "$OUTCOME" = failure
          test -z "$CACHE_PATH"
          rm -rf "$RUNNER_TEMP/debz-download-exact"
      - name: Reject package-only offline restore
        id: offline
        continue-on-error: true
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-offline
          offline: 'true'
      - name: Validate offline metadata failure
        env:
          CACHE_PATH: ${{ steps.offline.outputs.cache-path }}
          OUTCOME: ${{ steps.offline.outcome }}
        run: |
          test "$OUTCOME" = failure
          test -z "$CACHE_PATH"

  download-action-container-fixture:
    name: Build download action container fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Build static CLI and signed fixture
        run: |
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe \
            -Dversion=0.3.0-ci.${{ github.run_id }}.${{ github.run_attempt }} \
            release-install --prefix "$PWD/out/download-container/release"
          python3 tools/generate-integration-repository.py \
            --output "$PWD/out/download-container/repository" \
            --suite debian-stable --architecture amd64
      - name: Upload container fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: download-action-container-fixture
          path: out/download-container
          if-no-files-found: error
          retention-days: 1

  download-action-container:
    name: Download action in bare Ubuntu container
    needs: download-action-container-fixture
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download prepared fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: download-action-container-fixture
          path: out/download-container
      - name: Confirm optional host tools are absent and create lock
        id: fixture
        shell: sh
        run: |
          ! command -v python3
          ! command -v pipx
          ! command -v curl
          ! command -v gh
          workspace="$PWD/out/download-container"
          chmod 0755 "$workspace/release/bin/debz"
          mkdir -p "$workspace/root" "$workspace/metadata" "$workspace/state"
          cat >"$workspace/fixture.sources" <<EOF
          Types: deb
          URIs: file://$workspace/repository
          Suites: debian-stable
          Components: main
          Architectures: amd64
          Signed-By: $workspace/repository/fixture-keyring.gpg
          EOF
          "$workspace/release/bin/debz" plan \
            --install-root "$workspace/root" \
            --cache-path "$workspace/metadata" \
            --state-path "$workspace/state" \
            --architecture amd64 \
            --source "$workspace/fixture.sources" \
            --keyring "$workspace/repository/fixture-keyring.gpg" \
            --lock-output "$workspace/lock.json" scenario-main --json >/dev/null
          printf 'source=%s\nkeyring=%s\nlock=%s\n' \
            "$workspace/fixture.sources" \
            "$workspace/repository/fixture-keyring.gpg" \
            "$workspace/lock.json" >>"$GITHUB_OUTPUT"
          printf '%s\n' "$workspace/release/bin" >>"$GITHUB_PATH"
      - name: Prepare closure without host package or download tools
        id: download
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache: 'false'
      - name: Validate clean-container download
        shell: sh
        env:
          CACHE_HIT: ${{ steps.download.outputs.cache-hit }}
          DOWNLOADED: ${{ steps.download.outputs.downloaded-count }}
          REUSED: ${{ steps.download.outputs.reused-count }}
        run: |
          test "$CACHE_HIT" = false
          test "$DOWNLOADED" -gt 0
          test "$REUSED" -eq 0
      - name: Execute cache-only transaction directly as container root
        shell: sh
        env:
          CACHE_ROOT: ${{ steps.download.outputs.cache-root }}
          LOCK: ${{ steps.fixture.outputs.lock }}
          SOURCE: ${{ steps.fixture.outputs.source }}
          KEYRING: ${{ steps.fixture.outputs.keyring }}
        run: |
          workspace="$PWD/out/download-container"
          mkdir -p "$workspace/install-root" "$workspace/install-state"
          "$workspace/release/bin/debz" install \
            --install-root "$workspace/install-root" \
            --cache-path "$CACHE_ROOT" \
            --state-path "$workspace/install-state" \
            --architecture amd64 \
            --source "$SOURCE" \
            --keyring "$KEYRING" \
            --lock-input "$LOCK" \
            --repository-policy strict-priority \
            --cache-only --assume-yes --noninteractive \
            --conffile keep-existing --json scenario-main \
            >"$workspace/install-command.json"
          "$workspace/release/bin/debz" transaction-result verify \
            --state-path "$workspace/install-state" \
            --lock-input "$LOCK" --architecture amd64 --json \
            >"$workspace/install-summary.json"
          grep -q '"exit_status":0' "$workspace/install-command.json"
          grep -q '"outcome":"succeeded"' "$workspace/install-summary.json"

  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            architecture: amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
            architecture: arm64

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install metadata decompression dependency
        run: |
          if ! command -v pkg-config >/dev/null ||
             ! pkg-config --exists liblzma libzstd; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 update
            sudo apt-get install --yes --no-install-recommends liblzma-dev libzstd-dev
          fi
      - name: Build and test
        run: |
          zig build
          zig build test
          zig build test-release
          zig build fuzz
          zig build -Doptimize=ReleaseSafe
          zig build -Doptimize=ReleaseSafe test
          zig build -Doptimize=ReleaseSafe fuzz
          zig build run -- --help
      - name: Prepare native download action fixture
        id: download-fixture
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          workspace="$PWD/.zig-cache/download-native"
          mkdir -p "$workspace/root" "$workspace/metadata" "$workspace/state"
          python3 tools/generate-integration-repository.py \
            --output "$workspace/repository" --suite debian-stable \
            --architecture "$ARCHITECTURE"
          cat >"$workspace/fixture.sources" <<EOF
          Types: deb
          URIs: file://$workspace/repository
          Suites: debian-stable
          Components: main
          Architectures: $ARCHITECTURE
          Signed-By: $workspace/repository/fixture-keyring.gpg
          EOF
          zig-out/bin/debz plan \
            --install-root "$workspace/root" \
            --cache-path "$workspace/metadata" \
            --state-path "$workspace/state" \
            --architecture "$ARCHITECTURE" \
            --source "$workspace/fixture.sources" \
            --keyring "$workspace/repository/fixture-keyring.gpg" \
            --lock-output "$workspace/lock.json" scenario-main --json >/dev/null
          printf 'source=%s\nkeyring=%s\nlock=%s\n' \
            "$workspace/fixture.sources" \
            "$workspace/repository/fixture-keyring.gpg" \
            "$workspace/lock.json" >>"$GITHUB_OUTPUT"
          printf '%s\n' "$PWD/zig-out/bin" >>"$GITHUB_PATH"
      - name: Prepare native exact-lock package closure
        id: download
        uses: ./actions/download
        with:
          lock-input: ${{ steps.download-fixture.outputs.lock }}
          source: ${{ steps.download-fixture.outputs.source }}
          keyring: ${{ steps.download-fixture.outputs.keyring }}
          architecture: ${{ matrix.architecture }}
          cache: 'false'
      - name: Validate native download action outputs
        env:
          CACHE_HIT: ${{ steps.download.outputs.cache-hit }}
          CACHE_PATH: ${{ steps.download.outputs.cache-path }}
          DOWNLOADED: ${{ steps.download.outputs.downloaded-count }}
          REUSED: ${{ steps.download.outputs.reused-count }}
        run: |
          test "$CACHE_HIT" = false
          test -d "$CACHE_PATH"
          test "$DOWNLOADED" -gt 0
          test "$REUSED" -eq 0

  security-audit:
    name: Security and dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install audited system dependency
        run: |
          if ! command -v pkg-config >/dev/null ||
             ! pkg-config --exists liblzma libzstd; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 update
            sudo apt-get install --yes --no-install-recommends \
              liblzma-dev libzstd-dev pkg-config
          fi
      - name: Test real acceptance input validation
        run: |
          tools/real-snapshot-acceptance.sh --validate-values \
            https://snapshot.ubuntu.com/ubuntu/20260816T000000Z resolute amd64
          ! tools/real-snapshot-acceptance.sh --validate-values \
            https://example.invalid resolute amd64
      - name: Run static security audit
        run: zig build security-audit

  release-dry-run:
    name: Required release dry-run (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-linux-musl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Build, package, and audit v0.3.0 binary assets
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          zon_version=$(python3 -c 'import pathlib,re; text=pathlib.Path("build.zig.zon").read_text(); match=re.search(r"(?m)^\s*\.version\s*=\s*\"([^\"]+)\"", text); assert match; print(match.group(1))')
          version=$(python3 tools/release.py version v0.3.0 --expect "zon=$zon_version")
          zig build -Dtarget="$TARGET" -Doptimize=ReleaseSafe -Dversion="$version" release-install \
            --prefix "$PWD/.zig-cache/release-install"
          python3 tools/release.py version v0.3.0 --expect "zon=$zon_version" \
            --expect "binary=$(.zig-cache/release-install/bin/debz version)"
          epoch=$(git show -s --format=%ct HEAD)
          python3 tools/release.py binary --tag v0.3.0 --platform "$PLATFORM" \
            --prefix .zig-cache/release-install --epoch "$epoch" \
            --output release-assets
          for format in tar.gz tar.xz; do
            python3 tools/release.py audit --tag v0.3.0 \
              --platform "$PLATFORM" \
              --archive "release-assets/debz-0.3.0-$PLATFORM.$format" --smoke
          done
      - name: Upload dry-run binary assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run-${{ matrix.platform }}
          path: |
            release-assets/debz-0.3.0-${{ matrix.platform }}.tar.gz
            release-assets/debz-0.3.0-${{ matrix.platform }}.tar.xz
          if-no-files-found: error
          retention-days: 1

  release-dry-run-verify:
    name: Required release dry-run exact verification
    needs: release-dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download merged dry-run assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-dry-run-*
          path: release-assets
          merge-multiple: true
      - name: Verify exact four-archive dry-run
        run: |
          python3 tools/release.py verify --tag v0.3.0 \
            --assets release-assets --smoke

  release-policy:
    name: Required release workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Audit release workflow policy
        run: tools/release-workflow-policy.py

  fuzz:
    name: Bounded mutation fuzzing (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install metadata decompression dependency
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo apt-get install --yes --no-install-recommends liblzma-dev libzstd-dev
      - name: Run bounded fuzz campaign
        run: zig build fuzz -Dfuzz-cases=${{ github.event_name == 'schedule' && '5000' || '128' }}

  integration-required:
    name: Required disposable root (${{ matrix.suite }}/${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: debian-stable
            architecture: amd64
            runner: ubuntu-24.04
          - suite: ubuntu-26.04
            architecture: amd64
            runner: ubuntu-24.04
          - suite: debian-stable
            architecture: arm64
            runner: ubuntu-24.04-arm
          - suite: ubuntu-26.04
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install bounded fixture prerequisites
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo apt-get install --yes --no-install-recommends dpkg liblzma-dev libzstd-dev python3-cryptography
      - name: Run required integration root
        env:
          DEBZ_INTEGRATION_SUITE: ${{ matrix.suite }}
          DEBZ_INTEGRATION_ARCH: ${{ matrix.architecture }}
          DEBZ_INTEGRATION_MODE: full
          DEBZ_INTEGRATION_SUDO: "1"
        run: zig build test-integration
      - name: Normalize diagnostic ownership
        if: always()
        run: sudo chown -R "$USER:$USER" ".zig-cache/integration-${{ matrix.suite }}-${{ matrix.architecture }}" || true
      - name: Upload root diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-required-${{ matrix.suite }}-${{ matrix.architecture }}
          path: .zig-cache/integration-${{ matrix.suite }}-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 7

  integration-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Full disposable root (${{ matrix.suite }}/${{ matrix.architecture }}/${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: debian-stable
            architecture: arm64
            runner: ubuntu-24.04
          - suite: ubuntu-26.04
            architecture: arm64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install bounded fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg liblzma-dev libzstd-dev python3-cryptography
      - name: Run full integration root
        env:
          DEBZ_INTEGRATION_SUITE: ${{ matrix.suite }}
          DEBZ_INTEGRATION_ARCH: ${{ matrix.architecture }}
          DEBZ_INTEGRATION_MODE: full
          DEBZ_INTEGRATION_SUDO: "1"
        run: zig build test-integration
      - name: Normalize diagnostic ownership
        if: always()
        run: sudo chown -R "$USER:$USER" ".zig-cache/integration-${{ matrix.suite }}-${{ matrix.architecture }}" || true
      - name: Upload root diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-${{ matrix.suite }}-${{ matrix.architecture }}-${{ matrix.runner }}
          path: .zig-cache/integration-${{ matrix.suite }}-${{ matrix.architecture }}/
          if-no-files-found: ignore
          retention-days: 7

  ubuntu-real-snapshot:
    if: github.event_name == 'workflow_dispatch'
    name: Real Ubuntu snapshot (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate pinned native acceptance inputs
        env:
          SNAPSHOT_URI: ${{ inputs.ubuntu_snapshot_uri }}
          SNAPSHOT_SUITE: ${{ inputs.ubuntu_snapshot_suite }}
        run: |
          tools/real-snapshot-acceptance.sh --validate \
            "$SNAPSHOT_URI" "$SNAPSHOT_SUITE" "${{ matrix.architecture }}"
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install test runner prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg jq liblzma-dev libzstd-dev
      - name: Build production CLI
        run: zig build -Doptimize=ReleaseSafe
      - name: Create and replay exact Ubuntu root
        env:
          SNAPSHOT_URI: ${{ inputs.ubuntu_snapshot_uri }}
          SNAPSHOT_SUITE: ${{ inputs.ubuntu_snapshot_suite }}
        run: |
          sudo --preserve-env=SNAPSHOT_URI,SNAPSHOT_SUITE \
            tools/real-snapshot-acceptance.sh "$PWD/zig-out/bin/debz" \
            "$SNAPSHOT_URI" "$SNAPSHOT_SUITE" "${{ matrix.architecture }}" \
            "$PWD/.real-snapshot/${{ matrix.architecture }}"
      - name: Collect diagnostics and clean staged payloads
        if: always()
        run: |
          work=".real-snapshot/${{ matrix.architecture }}"
          sudo mkdir -p "$work/evidence"
          sudo cp -a "$work/state/." "$work/evidence/state/" 2>/dev/null || true
          sudo cp "$work/root/var/lib/dpkg/status" "$work/evidence/status-final" 2>/dev/null || true
          sudo cp "$work/ubuntu.sources" "$work/evidence/" 2>/dev/null || true
          sudo cp "$work/ubuntu.json" "$work/evidence/" 2>/dev/null || true
          sudo du -sh "$work" >"$work/evidence/disk-usage-final.txt" 2>/dev/null || true
          sudo rm -rf "$work/root" "$work/cache"
          sudo chown -R "$USER:$USER" .real-snapshot
      - name: Upload real acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-real-snapshot-${{ matrix.architecture }}
          path: .real-snapshot/${{ matrix.architecture }}/evidence/
          if-no-files-found: error
          retention-days: 14
