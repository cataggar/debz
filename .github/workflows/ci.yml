            bash -euo pipefail -c '
            tree=$1 architecture=$2 expected=$3 bundle=$4
            [[ $tree =~ ^/srv/debz-protected/ci-[0-9]+-[0-9]+-(amd64|arm64)$ ]]
            [[ ${BASH_REMATCH[1]} == "$architecture" && $expected =~ ^[0-9a-f]{40}$ ]]
            umask 022
            [[ -e /srv/debz-protected ]] || mkdir -m 0755 /srv/debz-protected
            for ancestor in / /srv /srv/debz-protected; do
              [[ -d $ancestor && ! -L $ancestor && $(stat -c %u:%g "$ancestor") == 0:0 ]]
              (( ($(stat -c 0%a "$ancestor") & 022) == 0 ))
            done
            mkdir -m 0700 -- "$tree"
            install -o root -g root -m 0600 -- "$bundle" "$tree/debz.bundle"
            git init --quiet --bare "$tree/bare.git"
            printf "%s\n" "$expected" >"$tree/bare.git/shallow"
            git --git-dir="$tree/bare.git" bundle verify "$tree/debz.bundle"
            git --git-dir="$tree/bare.git" fetch --quiet "$tree/debz.bundle" HEAD:refs/heads/protected
            test "$(git --git-dir="$tree/bare.git" rev-parse refs/heads/protected)" = "$expected"
            git --git-dir="$tree/bare.git" symbolic-ref HEAD refs/heads/protected
            git --git-dir="$tree/bare.git" fsck --full --no-dangling
            git clone --quiet --no-hardlinks "file://$tree/bare.git" "$tree/checkout"
            test "$(git -C "$tree/checkout" rev-parse HEAD)" = "$expected"
            exec bash "$tree/checkout/tools/real-snapshot-reference-protected-ci.sh" "$tree" "$architecture" "$expected"
            ' protected-bootstrap "$PROTECTED_TREE" "$ARCHITECTURE" "$GITHUB_SHA" "$bundle"
      - name: Copy bounded protected evidence
        if: always()
        run: |
          output="$RUNNER_TEMP/protected-reference-$ARCHITECTURE"
          mkdir -p "$output"
          sudo -n test -d "$PROTECTED_TREE/upload"
          sudo -n tar -C "$PROTECTED_TREE/upload" -cf - . >"$RUNNER_TEMP/protected-evidence.tar"
          tar --no-same-owner --no-same-permissions -C "$output" -xf "$RUNNER_TEMP/protected-evidence.tar"
          test -s "$output/result.txt"
          cat "$output/result.txt"
      - name: Upload protected reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-reference-${{ matrix.architecture }}
          path: ${{ runner.temp }}/protected-reference-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 14
      - name: Kill protected descendants and remove the named tree
        if: always()
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C bash -euo pipefail -c '
            tree=$1
            [[ $tree =~ ^/srv/debz-protected/ci-[0-9]+-[0-9]+-(amd64|arm64)$ ]]
            [[ -e $tree || -L $tree ]] || exit 0
            [[ -d $tree && ! -L $tree ]]
            for attempt in 1 2 3 4 5; do
              victims=()
              for process in /proc/[0-9]*; do
                root=$(readlink "$process/root" 2>/dev/null) || continue
                cwd=$(readlink "$process/cwd" 2>/dev/null) || cwd=
                case "$root/ $cwd/" in
                  *"$tree/"*) victims+=("${process#/proc/}") ;;
                esac
              done
              (( ${#victims[@]} )) || break
              echo "killing protected descendants: ${victims[*]}"
              kill -KILL "${victims[@]}" 2>/dev/null || true
              sleep 1
            done
            (( ${#victims[@]} == 0 ))
            if grep -F " $tree" /proc/self/mountinfo; then
              echo "mounts remain beneath $tree" >&2
              exit 1
            fi
            rm -rf --one-file-system -- "$tree"
            test ! -e "$tree"
            ' protected-cleanup "$PROTECTED_TREE"
