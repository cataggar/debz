name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_real_ubuntu_snapshot:
        description: "Run optional authenticated Ubuntu snapshot smoke lane"
        required: false
        type: boolean
        default: false
      ubuntu_snapshot_uri:
        description: "Immutable Ubuntu snapshot URI"
        required: false
        type: string
      ubuntu_snapshot_suite:
        description: "Snapshot suite/codename"
        required: false
        type: string
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install metadata decompression dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends liblzma-dev
      - name: Build and test
        run: |
          zig build
          zig build test
          zig build fuzz
          zig build -Doptimize=ReleaseSafe
          zig build -Doptimize=ReleaseSafe test
          zig build -Doptimize=ReleaseSafe fuzz
          zig build run -- --help

  security-audit:
    name: Security and dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install audited system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends liblzma-dev pkg-config
      - name: Run static security audit
        run: zig build security-audit

  fuzz:
    name: Bounded mutation fuzzing (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install metadata decompression dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends liblzma-dev
      - name: Run bounded fuzz campaign
        run: zig build fuzz -Dfuzz-cases=${{ github.event_name == 'schedule' && '5000' || '128' }}

  integration-required:
    name: Required disposable root (${{ matrix.suite }}/${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: debian-stable
            architecture: amd64
            runner: ubuntu-24.04
          - suite: ubuntu-26.04
            architecture: amd64
            runner: ubuntu-24.04
          - suite: debian-stable
            architecture: arm64
            runner: ubuntu-24.04-arm
          - suite: ubuntu-26.04
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install bounded fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg liblzma-dev python3-cryptography
      - name: Run required integration root
        env:
          DEBZ_INTEGRATION_SUITE: ${{ matrix.suite }}
          DEBZ_INTEGRATION_ARCH: ${{ matrix.architecture }}
          DEBZ_INTEGRATION_MODE: full
          DEBZ_INTEGRATION_SUDO: "1"
        run: zig build test-integration
      - name: Normalize diagnostic ownership
        if: always()
        run: sudo chown -R "$USER:$USER" ".zig-cache/integration-${{ matrix.suite }}-${{ matrix.architecture }}" || true
      - name: Upload root diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-required-${{ matrix.suite }}-${{ matrix.architecture }}
          path: .zig-cache/integration-${{ matrix.suite }}-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 7

  integration-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Full disposable root (${{ matrix.suite }}/${{ matrix.architecture }}/${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: debian-stable
            architecture: arm64
            runner: ubuntu-24.04
          - suite: ubuntu-26.04
            architecture: arm64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install bounded fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg liblzma-dev python3-cryptography
      - name: Run full integration root
        env:
          DEBZ_INTEGRATION_SUITE: ${{ matrix.suite }}
          DEBZ_INTEGRATION_ARCH: ${{ matrix.architecture }}
          DEBZ_INTEGRATION_MODE: full
          DEBZ_INTEGRATION_SUDO: "1"
        run: zig build test-integration
      - name: Normalize diagnostic ownership
        if: always()
        run: sudo chown -R "$USER:$USER" ".zig-cache/integration-${{ matrix.suite }}-${{ matrix.architecture }}" || true
      - name: Upload root diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-${{ matrix.suite }}-${{ matrix.architecture }}-${{ matrix.runner }}
          path: .zig-cache/integration-${{ matrix.suite }}-${{ matrix.architecture }}/
          if-no-files-found: ignore
          retention-days: 7

  ubuntu-real-snapshot:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_ubuntu_snapshot
    name: Optional real Ubuntu snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate opt-in inputs
        env:
          SNAPSHOT_URI: ${{ inputs.ubuntu_snapshot_uri }}
          SNAPSHOT_SUITE: ${{ inputs.ubuntu_snapshot_suite }}
        run: |
          test -n "$SNAPSHOT_URI"
          test -n "$SNAPSHOT_SUITE"
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install audited system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends liblzma-dev
      - name: Authenticated refresh and deterministic plan
        env:
          SNAPSHOT_URI: ${{ inputs.ubuntu_snapshot_uri }}
          SNAPSHOT_SUITE: ${{ inputs.ubuntu_snapshot_suite }}
        run: |
          set -euo pipefail
          mkdir -p .real-snapshot/{cache,state,root}
          cp /usr/share/keyrings/ubuntu-archive-keyring.gpg .real-snapshot/ubuntu-archive.gpg
          keyring="$PWD/.real-snapshot/ubuntu-archive.gpg"
          cat > .real-snapshot/ubuntu.sources <<EOF
          Types: deb
          URIs: $SNAPSHOT_URI
          Suites: $SNAPSHOT_SUITE
          Components: main
          Architectures: amd64
          Signed-By: $keyring
          EOF
          zig build
          debz="$PWD/zig-out/bin/debz"
          common="--install-root $PWD/.real-snapshot/root --cache-path $PWD/.real-snapshot/cache --state-path $PWD/.real-snapshot/state --architecture amd64 --source $PWD/.real-snapshot/ubuntu.sources --keyring $keyring --json"
          "$debz" refresh $common
          "$debz" plan $common ubuntu-minimal
