  arm64-dpkg-oracles:
    if: github.event_name == 'workflow_dispatch' && inputs.run_arm64_dpkg_oracles
    name: Pinned dpkg 1.22.22 ARM64 oracles
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bind source and runner architecture
        env:
          EXPECTED_INVOCATION_CLOCK: "2026-09-20T16:29:21.965+00:00"
        run: |
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = cataggar/debz
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = "refs/heads/$GITHUB_REF_NAME"
          test "$EXPECTED_INVOCATION_CLOCK" = "2026-09-20T16:29:21.965+00:00"
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Build and test native oracle evidence tooling
        run: |
          zig build build-dpkg-oracle-evidence test-dpkg-oracle-evidence -Doptimize=ReleaseSafe -j2 --summary all
      - name: Prepare digest-verified private ARM64 tools
        run: |
          reference_dpkg="$(python3 tools/prepare-native-dpkg.py --architecture arm64)"
          reference_prefix="$(dirname "$(dirname "$reference_dpkg")")"
          test "$reference_dpkg" = "$PWD/.cache/native-dpkg-reference/1.22.22/arm64/usr/bin/dpkg"
          test -x "$reference_prefix/bin/update-alternatives"
          test -f "$PWD/.cache/native-dpkg-reference/1.22.22/arm64/reference-receipt-v1.json"
      - name: Execute bounded ARM64 references
        run: |
          output="$PWD/.tmp/arm64-dpkg-oracles"
          reference="$PWD/.cache/native-dpkg-reference/1.22.22/arm64/usr/bin"
          mkdir -p "$output/host-config/dpkg.cfg.d"
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location(
              "debz_config_reference",
              Path("tools/dpkg-config-reference.py"),
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path(".tmp/arm64-dpkg-oracles/host-config/dpkg.cfg").write_bytes(
              module.PINNED_DPKG_CONFIG
          )
          PY
          if ! sudo -n /usr/bin/unshare --mount --propagation private \
            /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            LANG=C \
            LC_ALL=C \
            PYTHONDONTWRITEBYTECODE=1 \
            TMPDIR="$PWD/.tmp" \
            XDG_CACHE_HOME="$PWD/.cache" \
            /bin/sh tools/run-dpkg-oracle-isolated.sh \
              "$PWD" config arm64 "$reference/dpkg" \
              "$output/dpkg-config-reference-arm64-observed-v1.json" \
              >"$output/config.stdout" 2>"$output/config.stderr"; then
            sed -n '1,160p' "$output/config.stderr"
            exit 1
          fi
          if ! sudo -n /usr/bin/unshare --mount --propagation private \
            /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            LANG=C \
            LC_ALL=C \
            PYTHONDONTWRITEBYTECODE=1 \
            TMPDIR="$PWD/.tmp" \
            XDG_CACHE_HOME="$PWD/.cache" \
            /bin/sh tools/run-dpkg-oracle-isolated.sh \
              "$PWD" alternatives arm64 "$reference/dpkg" \
              "$output/dpkg-alternatives-reference-arm64-observed-v1.json" \
              "$reference/update-alternatives" \
              >"$output/alternatives.stdout" 2>"$output/alternatives.stderr"; then
            sed -n '1,160p' "$output/alternatives.stderr"
            exit 1
          fi
          sudo chown -R "$USER:$USER" "$output"
      - name: Bind and validate canonical evidence
        env:
          INVOCATION_CLOCK: "2026-09-20T16:29:21.965+00:00"
        run: |
          output="$PWD/.tmp/arm64-dpkg-oracles"
          reference="$PWD/.cache/native-dpkg-reference/1.22.22/arm64/usr/bin"
          PATH=/no-host-interpreters zig-out/bin/debz-dpkg-oracle-evidence create \
            --architecture arm64 \
            --source-commit "$GITHUB_SHA" \
            --invocation-clock "$INVOCATION_CLOCK" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job "$GITHUB_JOB" \
            --runner-label ubuntu-24.04-arm \
            --runner-arch "$RUNNER_ARCH" \
            --machine aarch64 \
            --dpkg "$reference/dpkg" \
            --update-alternatives "$reference/update-alternatives" \
            --receipt \
              "$PWD/.cache/native-dpkg-reference/1.22.22/arm64/reference-receipt-v1.json" \
            --config-observation \
              "$output/dpkg-config-reference-arm64-observed-v1.json" \
            --config-stdout "$output/config.stdout" \
            --config-stderr "$output/config.stderr" \
            --alternatives-observation \
              "$output/dpkg-alternatives-reference-arm64-observed-v1.json" \
            --alternatives-stdout "$output/alternatives.stdout" \
            --alternatives-stderr "$output/alternatives.stderr" \
            --output "$output/dpkg-oracle-execution-evidence-arm64-v1.json"
          PATH=/no-host-interpreters zig-out/bin/debz-dpkg-oracle-evidence verify \
            --evidence "$output/dpkg-oracle-execution-evidence-arm64-v1.json" \
            --artifact-root "$output"
          python3 -m unittest \
            tools/test_dpkg_config_reference.py \
            tools/test_dpkg_alternatives_reference.py
      - name: Upload canonical ARM64 oracle evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dpkg-oracle-execution-evidence-arm64-${{ github.sha }}
          path: |
            .tmp/arm64-dpkg-oracles/dpkg-config-reference-arm64-observed-v1.json
            .tmp/arm64-dpkg-oracles/dpkg-alternatives-reference-arm64-observed-v1.json
            .tmp/arm64-dpkg-oracles/dpkg-oracle-execution-evidence-arm64-v1.json
          if-no-files-found: error
          retention-days: 14

  signed-proc-protected-replay:
    name: Signed proc replay in protected amd64 roots (${{ matrix.optimize }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    env:
      OPTIMIZE: ${{ matrix.optimize }}
      PROTECTED: /srv/debz-protected/signed-proc
      # ubuntu-keyring 2023.11.28.1 ubuntu-archive-keyring.gpg authenticates the pinned snapshot.
      UBUNTU_ARCHIVE_KEYRING_SHA256: 80a36b0a6de2f69f49d2df75ef473ccde121e9e190b9ea01d20a4f63778d5c31
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Bind the reviewed commit to a hosted amd64 runner
        run: |
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$PROTECTED" && test ! -L "$PROTECTED"
      - name: Install metadata decompression dependency
        run: |
          if ! command -v pkg-config >/dev/null ||
             ! pkg-config --exists liblzma libzstd ||
             ! command -v jq >/dev/null; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 update
            sudo apt-get install --yes --no-install-recommends jq liblzma-dev libzstd-dev pkg-config
          fi
      - name: Prepare pinned dpkg as the runner user
        id: reference
        run: |
          reference_dpkg="$(python3 tools/prepare-native-dpkg.py --architecture amd64)"
          test "$reference_dpkg" = "$PWD/.cache/native-dpkg-reference/1.22.22/amd64/usr/bin/dpkg"
          printf 'dpkg=%s\n' "$reference_dpkg" >>"$GITHUB_OUTPUT"
      - name: Refuse unprotected and incomplete signed replay inputs
        run: |
          set -euo pipefail
          mkdir -p .tmp
          if sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            tools/real-snapshot-signed-proc-prestates.sh "$PWD/.real-snapshot/dpkg" \
            "$PWD/.real-snapshot/ws" 2>.tmp/unprotected-prestates.log; then exit 1; fi
          grep -Fq 'prestate path is writable by an unprivileged user' .tmp/unprotected-prestates.log
          if sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            tools/real-snapshot-signed-proc-bindings.sh "$PWD/zig-out/bin/debz" \
            "$PWD/.real-snapshot/ws" 2>.tmp/unprotected-bindings.log; then exit 1; fi
          grep -Fq 'fixture path is writable by an unprivileged user' .tmp/unprotected-bindings.log
          if zig build test-native-signed-proc -j2 2>.tmp/missing-roots.log; then exit 1; fi
          grep -Fq 'signed proc replay requires -Dsigned-systemd-proc-root' .tmp/missing-roots.log
          if zig build test-native-signed-proc -j2 -Dsigned-systemd-proc-root=relative \
            -Dsigned-udev-proc-root=/protected/udev -Dsigned-sudo-proc-root=/protected/udev \
            2>.tmp/relative-roots.log; then exit 1; fi
          grep -Fq 'three distinct absolute disposable root paths' .tmp/relative-roots.log
      - name: Stage the reviewed commit, Zig and pinned dpkg under root-owned ancestry
        env:
          REFERENCE_DPKG: ${{ steps.reference.outputs.dpkg }}
        run: |
          set -euo pipefail
          git -c tar.umask=0022 archive --format=tar -o .tmp/protected-checkout.tar HEAD
          zig_binary="$(readlink -f "$(command -v zig)")"
          zig_home="$(dirname "$zig_binary")"
          test -f "$zig_home/lib/std/std.zig"
          reference_prefix="$(dirname "$(dirname "$(dirname "$REFERENCE_DPKG")")")"
          sudo -n install -d -o root -g root -m 0755 /srv/debz-protected
          sudo -n install -d -o root -g root -m 0755 "$PROTECTED" "$PROTECTED/checkout"
          sudo -n install -d -o root -g root -m 0700 "$PROTECTED/zig-global-cache"
          sudo -n install -o root -g root -m 0644 .tmp/protected-checkout.tar "$PROTECTED/checkout.tar"
          sudo -n tar -C "$PROTECTED/checkout" --no-same-owner -xf "$PROTECTED/checkout.tar"
          sudo -n cp -R -- "$zig_home" "$PROTECTED/zig"
          sudo -n install -d -o root -g root -m 0700 "$PROTECTED/checkout/.real-snapshot" \
            "$PROTECTED/checkout/.tmp" "$PROTECTED/checkout/.cache"
          sudo -n cp -R -- "$reference_prefix" "$PROTECTED/checkout/.real-snapshot/pinned-dpkg"
          sudo -n install -d -o root -g root -m 0755 "$PROTECTED/keyrings"
          sudo -n install -o root -g root -m 0644 /usr/share/keyrings/ubuntu-archive-keyring.gpg \
            "$PROTECTED/keyrings/ubuntu-archive-keyring.gpg"
          sha256sum --check --strict \
            <<<"$UBUNTU_ARCHIVE_KEYRING_SHA256  $PROTECTED/keyrings/ubuntu-archive-keyring.gpg"
          sudo -n chmod -R go-w "$PROTECTED"
          sudo -n find "$PROTECTED" -xdev \( ! -uid 0 -o ! -gid 0 -o -perm /022 \) ! -type l \
            -print >.tmp/protected-writable.txt
          test ! -s .tmp/protected-writable.txt
          for path in / /srv /srv/debz-protected "$PROTECTED"; do
            test "$(stat -c '%u:%g' "$path")" = 0:0
            test $(( 8#$(stat -c '%a' "$path") & 022 )) -eq 0
          done
          sudo -n cmp -- "$zig_binary" "$PROTECTED/zig/zig"
          test "$(sudo -n env -i "$PROTECTED/zig/zig" version)" = 0.16.0
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin PYTHONDONTWRITEBYTECODE=1 \
            python3 "$PROTECTED/checkout/tools/prepare-native-dpkg.py" --architecture amd64 \
            --verify-only "$PROTECTED/checkout/.real-snapshot/pinned-dpkg/usr/bin/dpkg"
          sha256sum .tmp/protected-checkout.tar "$zig_binary"
      - name: Build the protected snapshot client
        timeout-minutes: 12
        working-directory: ${{ env.PROTECTED }}/checkout
        run: |
          sudo -n env -i PATH="$PROTECTED/zig:/usr/sbin:/usr/bin:/sbin:/bin" HOME=/root \
            ZIG_GLOBAL_CACHE_DIR="$PROTECTED/zig-global-cache" \
            zig build -Doptimize=Debug -j2 --summary all
      - name: Authenticate the snapshot closure and generate fresh signed prestates
        timeout-minutes: 12
        working-directory: ${{ env.PROTECTED }}/checkout
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LC_ALL=C.UTF-8 \
            DEBZ_REAL_SNAPSHOT_KEYRING="$PROTECTED/keyrings/ubuntu-archive-keyring.gpg" \
            tools/real-snapshot-signed-proc-bindings.sh "$PWD/zig-out/bin/debz" \
            "$PWD/.real-snapshot/ws"
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LC_ALL=C.UTF-8 \
            DEBZ_ZIG="$PROTECTED/zig/zig" \
            tools/real-snapshot-signed-proc-prestates.sh \
            "$PWD/.real-snapshot/pinned-dpkg/usr/bin/dpkg" "$PWD/.real-snapshot/ws"
          sudo -n test -s "$PWD/.real-snapshot/ws/prestate-build/evidence/base-cycle-proof/comparison.json"
          sudo -n test -s "$PWD/.real-snapshot/ws/prestate-build/evidence/openssl-cycle-after.json"
      - name: Run pinned dpkg proofs on separate prestate copies
        timeout-minutes: 8
        working-directory: ${{ env.PROTECTED }}/checkout
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LC_ALL=C.UTF-8 \
            bash -euo pipefail -c '
              ws=$1/.real-snapshot/ws
              pinned=$1/.real-snapshot/pinned-dpkg/usr/bin/dpkg
              install -d -o root -g root -m 0700 "$ws/native" "$ws/proof-sources" "$ws/proofs"
              for target in systemd udev sudo; do
                cp -a -- "$ws/prestates/$target" "$ws/native/$target"
                cp -a -- "$ws/prestates/$target" "$ws/proof-sources/$target"
                install -o root -g root -m 0755 "$ws/reference-tools/setpriv" \
                  "$ws/proof-sources/$target/usr/bin/setpriv"
              done
              # The sudo proof first restores the two signed payload links that
              # sudo unpack leaves; start the native replay from that state too.
              ln -sfn -- sudo.ws "$ws/native/sudo/usr/bin/sudoedit"
              ln -sfn -- sudo.ws.8.gz "$ws/native/sudo/usr/share/man/man8/sudoedit.8.gz"
              test "$(readlink -- "$ws/native/sudo/usr/bin/sudoedit")" = sudo.ws
              test "$(readlink -- "$ws/native/sudo/usr/share/man/man8/sudoedit.8.gz")" = sudo.ws.8.gz
              tools/real-snapshot-systemd-proc-reference.sh "$pinned" \
                "$ws/proof-sources/systemd" "$ws/proofs/systemd"
              tools/real-snapshot-udev-reference.sh "$pinned" \
                "$ws/proof-sources/udev" "$ws/proofs/udev"
              tools/real-snapshot-sudo-reference.sh "$pinned" \
                "$ws/proof-sources/sudo" "$ws/proofs/sudo"
            ' bash "$PWD"
      - name: Replay signed systemd, udev and sudo postinsts natively without skips
        timeout-minutes: 25
        working-directory: ${{ env.PROTECTED }}/checkout
        run: |
          set -euo pipefail
          ws="$PWD/.real-snapshot/ws"
          sudo -n env -i PATH="$PROTECTED/zig:/usr/sbin:/usr/bin:/sbin:/bin" HOME=/root \
            ZIG_GLOBAL_CACHE_DIR="$PROTECTED/zig-global-cache" \
            zig build test-native-signed-proc -Doptimize="$OPTIMIZE" -j2 --summary all \
              -Dsigned-systemd-proc-root="$ws/native/systemd" \
              -Dsigned-udev-proc-root="$ws/native/udev" \
              -Dsigned-sudo-proc-root="$ws/native/sudo" \
              >"$GITHUB_WORKSPACE/.tmp/signed-proc-replay.log" 2>&1 || status=$?
          cat "$GITHUB_WORKSPACE/.tmp/signed-proc-replay.log"
          test "${status:-0}" -eq 0
          # debz.test_0 is the root module's reference test; the other three are the signed replays.
          grep -Fxq 'All 4 tests passed.' "$GITHUB_WORKSPACE/.tmp/signed-proc-replay.log"
          for name in 'systemd postinst uses scoped masked proc' \
            'udev postinst uses only PID proc and applies static permissions' \
            'sudo postinst repairs only pinned alternatives with PID-only proc'; do
            grep -Fq "maintainer_script.test.signed $name...OK" "$GITHUB_WORKSPACE/.tmp/signed-proc-replay.log"
          done
          for target in systemd udev; do
            proof="$GITHUB_WORKSPACE/.tmp/signed-network-$target.proof"
            sudo -n cat "$PROTECTED/checkout/.tmp/signed-network-$target.proof" >"$proof"
            grep -Fxq "domain=$target" "$proof"
            grep -Fxq 'DEBZ_HOST_NETWORK_PROOF tcp=reachable abstract_unix=reachable inherited_fd=open' "$proof"
            case "$target" in
              systemd) proc_net=private ;;
              udev) proc_net=absent ;;
              *) exit 1 ;;
            esac
            grep -Fxq "DEBZ_SIGNED_NETWORK_PROOF proc_net=$proc_net interfaces=lo default_route=false host_tcp=denied abstract_unix=denied inherited_fd=sealed loopback=ok" "$proof"
          done
      - name: Compare native replays with pinned dpkg proofs
        timeout-minutes: 5
        working-directory: ${{ env.PROTECTED }}/checkout
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 bash -euo pipefail -c '
              ws=$1/.real-snapshot/ws
              python3 -m unittest tools/test_real_snapshot_signed_proc_compare.py
              install -d -o root -g root -m 0700 "$ws/compare"
              for target in systemd udev sudo; do
                python3 tools/real-snapshot-signed-proc-compare.py "$target" \
                  "$ws/native/$target" "$ws/proofs/$target" "$ws/compare/$target.json"
              done
            ' bash "$PWD"
      - name: Execute signed binding refusal fixtures
        timeout-minutes: 25
        working-directory: ${{ env.PROTECTED }}/checkout
        run: |
          set -euo pipefail
          sudo -n env -i PATH="$PROTECTED/zig:/usr/sbin:/usr/bin:/sbin:/bin" HOME=/root \
            ZIG_GLOBAL_CACHE_DIR="$PROTECTED/zig-global-cache" \
            DEBZ_REQUIRE_NATIVE_HELPER_NAMESPACE=1 \
            sh -c 'set -a && . "$1" && set +a && exec zig build test-maintainer-script \
              -Doptimize="$2" -j2 --summary all' \
            sh "$PWD/.real-snapshot/ws/bindings.env" "$OPTIMIZE" \
            >"$GITHUB_WORKSPACE/.tmp/signed-bindings.log" 2>&1 || status=$?
          cat "$GITHUB_WORKSPACE/.tmp/signed-bindings.log"
          test "${status:-0}" -eq 0
          grep -Eq '^[1-9][0-9]* passed; 3 skipped; 0 failed\.$' "$GITHUB_WORKSPACE/.tmp/signed-bindings.log"
      - name: Copy bounded evidence and remove named protected roots
        if: ${{ always() }}
        run: |
          set -euo pipefail
          evidence="$PWD/.tmp/signed-proc-evidence"
          mkdir -p "$evidence"
          cp .tmp/*.log "$evidence/" 2>/dev/null || true
          for target in systemd udev; do
            if [[ -f ".tmp/signed-network-$target.proof" ]]; then
              cp ".tmp/signed-network-$target.proof" "$evidence/"
            elif sudo -n test -f "$PROTECTED/checkout/.tmp/signed-network-$target.proof"; then
              sudo -n cat "$PROTECTED/checkout/.tmp/signed-network-$target.proof" \
                >"$evidence/signed-network-$target.proof"
            fi
          done
          if sudo -n test -d "$PROTECTED/checkout/.real-snapshot/ws"; then
            sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin bash -euo pipefail -c '
              ws=$1 out=$2
              for file in bindings.env prestates.env prestates/prestates.tsv \
                snapshot/evidence/ubuntu-minimal.lock.json \
                snapshot/evidence/refresh.json snapshot/evidence/refresh.stderr \
                snapshot/evidence/plan.json snapshot/evidence/plan.stderr \
                snapshot/evidence/download.json snapshot/evidence/download.stderr \
                prestate-build/evidence/reference-archives.tsv \
                prestate-build/evidence/reference-identity.txt \
                prestate-build/evidence/stopped-installed.txt \
                prestate-build/evidence/reference-install.stdout \
                prestate-build/evidence/reference-install.stderr \
                prestate-build/evidence/base-cycle-before.json \
                prestate-build/evidence/base-cycle-after.json \
                prestate-build/evidence/openssl-cycle-before.json \
                prestate-build/evidence/openssl-cycle-after.json \
                prestate-build/evidence/openssl-cycle-refusals.json \
                prestate-build/evidence/reference-no-progress.json \
                prestate-build/evidence/base-cycle-proof/comparison.json \
                prestate-build/evidence/base-cycle-proof/base-cycle-before.json \
                prestate-build/evidence/base-cycle-proof/base-cycle-after.json \
                prestate-build/evidence/base-cycle-proof/unpack.stdout \
                prestate-build/evidence/base-cycle-proof/unpack.stderr \
                prestate-build/evidence/base-cycle-proof/candidate.stdout \
                prestate-build/evidence/base-cycle-proof/candidate.stderr \
                prestate-build/evidence/base-cycle-proof/pending.stdout \
                prestate-build/evidence/base-cycle-proof/pending.stderr \
                prestate-build/evidence/base-cycle-proof/pending-result.json \
                prestate-build/evidence/base-cycle-proof/pending-status.json \
                prestate-build/evidence/base-cycle-proof/callback-refusal.log \
                compare/systemd.json compare/udev.json compare/sudo.json \
                native/systemd/var/log/dpkg.log native/udev/var/log/dpkg.log \
                native/sudo/var/log/dpkg.log \
                native/systemd/var/lib/dpkg/status native/udev/var/lib/dpkg/status \
                native/sudo/var/lib/dpkg/status \
                native/systemd/var/lib/dpkg/status-old native/udev/var/lib/dpkg/status-old \
                native/sudo/var/lib/dpkg/status-old \
                proofs/systemd/var/lib/dpkg/status proofs/udev/var/lib/dpkg/status \
                proofs/sudo/var/lib/dpkg/status \
                proofs/systemd/var/lib/dpkg/status-old proofs/udev/var/lib/dpkg/status-old \
                proofs/sudo/var/lib/dpkg/status-old \
                native/udev/etc/group proofs/udev/etc/group \
                proofs/systemd/var/log/dpkg.log proofs/udev/var/log/dpkg.log \
                proofs/sudo/var/log/dpkg.log proofs/sudo/var/log/alternatives.log \
                native/sudo/var/log/alternatives.log; do
                if [ -f "$ws/$file" ] && [ ! -L "$ws/$file" ]; then
                  tail -c 4194304 -- "$ws/$file" >"$out/${file//\//_}"
                fi
              done
            ' bash "$PROTECTED/checkout/.real-snapshot/ws" "$evidence"
          fi
          sudo -n chown -R "$(id -u):$(id -g)" "$evidence"
          findmnt -rn -o TARGET >.tmp/signed-proc-mounts.txt
          if grep -F "$PROTECTED" .tmp/signed-proc-mounts.txt; then
            echo "a protected fixture mount survived" >&2
            exit 1
          fi
          sudo -n rm -rf --one-file-system -- "$PROTECTED"
          test ! -e "$PROTECTED"
      - name: Upload bounded signed replay evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-proc-protected-replay-${{ matrix.optimize }}-${{ github.sha }}
          path: .tmp/signed-proc-evidence/
          if-no-files-found: error
          retention-days: 14

  build-and-test:
    name: Build and test (${{ matrix.name }})
    needs: [build-and-test-workload, build-and-test-workload-production, build-and-test-workload-apt-system, build-and-test-workload-native, build-and-test-workload-release, native-recovery-zig-workflows, native-recovery-zig-repository, native-recovery-zig-helper, native-recovery-zig-family, native-recovery-zig-scenarios, native-recovery-zig-diversions]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_full_matrix) }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        name: [linux-x64, linux-arm64]
    steps:
      - name: Require every build and native recovery shard
        env:
          BUILD_RESULT: ${{ needs.build-and-test-workload.result }}
          BUILD_PRODUCTION_RESULT: ${{ needs.build-and-test-workload-production.result }}
          BUILD_APT_SYSTEM_RESULT: ${{ needs.build-and-test-workload-apt-system.result }}
          BUILD_NATIVE_RESULT: ${{ needs.build-and-test-workload-native.result }}
          BUILD_RELEASE_RESULT: ${{ needs.build-and-test-workload-release.result }}
          RECOVERY_WORKFLOWS_RESULT: ${{ needs.native-recovery-zig-workflows.result }}
          RECOVERY_REPOSITORY_RESULT: ${{ needs.native-recovery-zig-repository.result }}
          RECOVERY_HELPER_RESULT: ${{ needs.native-recovery-zig-helper.result }}
          RECOVERY_FAMILY_RESULT: ${{ needs.native-recovery-zig-family.result }}
          RECOVERY_SCENARIOS_RESULT: ${{ needs.native-recovery-zig-scenarios.result }}
          RECOVERY_DIVERSIONS_RESULT: ${{ needs.native-recovery-zig-diversions.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$BUILD_PRODUCTION_RESULT" = success
          test "$BUILD_APT_SYSTEM_RESULT" = success
          test "$BUILD_NATIVE_RESULT" = success
          test "$BUILD_RELEASE_RESULT" = success
          test "$RECOVERY_WORKFLOWS_RESULT" = success
          test "$RECOVERY_REPOSITORY_RESULT" = success
          test "$RECOVERY_HELPER_RESULT" = success
          test "$RECOVERY_FAMILY_RESULT" = success
          test "$RECOVERY_SCENARIOS_RESULT" = success
          test "$RECOVERY_DIVERSIONS_RESULT" = success

  security-audit:
    name: Security and dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Install audited system dependency
        run: |
          if ! command -v pkg-config >/dev/null ||
             ! pkg-config --exists liblzma libzstd ||
             ! python3 -c 'import jsonschema' 2>/dev/null; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 update
            sudo apt-get install --yes --no-install-recommends \
              liblzma-dev libzstd-dev pkg-config python3-jsonschema
          fi
      - name: Test real acceptance input validation
        run: |
          tools/real-snapshot-acceptance.sh --validate-values \
            https://snapshot.ubuntu.com/ubuntu/20261001T000000Z resolute amd64
          ! tools/real-snapshot-acceptance.sh --validate-values \
            https://example.invalid resolute amd64
      - name: Run static security audit
        run: zig build security-audit
      - name: Prove root reference capability transition
        run: zig build test-real-snapshot-reference-launcher-root --summary all

  release-dry-run:
    name: Required release dry-run (${{ matrix.platform }})
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","Linux","{0}","ubuntu2604"]', matrix.runner == 'ubuntu-24.04-arm' && 'ARM64' || 'X64')) || matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-linux-musl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Build, package, and audit v0.3.0 binary assets
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          zon_version=$(python3 -c 'import pathlib,re; text=pathlib.Path("build.zig.zon").read_text(); match=re.search(r"(?m)^\s*\.version\s*=\s*\"([^\"]+)\"", text); assert match; print(match.group(1))')
          version=$(python3 tools/release.py version v0.3.0 --expect "zon=$zon_version")
          zig build -Dtarget="$TARGET" -Doptimize=ReleaseSafe -Dversion="$version" release-install \
            --prefix "$PWD/.zig-cache/release-install"
          python3 tools/release.py version v0.3.0 --expect "zon=$zon_version" \
            --expect "binary=$(.zig-cache/release-install/bin/debz version)"
          epoch=$(git show -s --format=%ct HEAD)
          python3 tools/release.py binary --tag v0.3.0 --platform "$PLATFORM" \
            --prefix .zig-cache/release-install --epoch "$epoch" \
            --output release-assets
          for format in tar.gz tar.xz; do
            python3 tools/release.py audit --tag v0.3.0 \
              --platform "$PLATFORM" \
              --archive "release-assets/debz-0.3.0-$PLATFORM.$format" --smoke
          done
      - name: Upload dry-run binary assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run-${{ matrix.platform }}
          path: |
            release-assets/debz-0.3.0-${{ matrix.platform }}.tar.gz
            release-assets/debz-0.3.0-${{ matrix.platform }}.tar.xz
          if-no-files-found: error
          retention-days: 1

      - name: Install verified standalone ghr
        id: ghr
        uses: cataggar/ghr/actions/setup@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        with:
          ghr-version: v0.8.1
      - name: Prove standalone ghr published-release smoke
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GHR_PATH: ${{ steps.ghr.outputs.ghr-path }}
          GHR_VERSION: ${{ steps.ghr.outputs.ghr-version }}
          GHR_TOOL_DIR: ${{ runner.temp }}/debz-release-ghr-tools
          GHR_BIN_DIR: ${{ runner.temp }}/debz-release-ghr-bin
          GHR_CACHE_DIR: ${{ runner.temp }}/debz-release-ghr-cache
          ARCHITECTURE: ${{ matrix.platform == 'linux-arm64' && 'arm64' || 'amd64' }}
          VERSION: 0.3.0
        run: |
          test -x "$GHR_PATH"
          test "$GHR_VERSION" = v0.8.1
          test "$(PATH=/no-host-interpreters "$GHR_PATH" version)" = 0.8.1
          PATH=/no-host-interpreters "$GHR_PATH" install "cataggar/debz@v$VERSION"
          bin_dir=$(PATH=/no-host-interpreters "$GHR_PATH" path bin)
          test "$bin_dir" = "$GHR_BIN_DIR"
          test -x "$bin_dir/debz"
          test "$(PATH=/no-host-interpreters "$bin_dir/debz" version)" = "$VERSION"
          PATH=/no-host-interpreters "$bin_dir/debz" --help
          workspace="$PWD/.zig-cache/ghr-release-smoke"
          mkdir -p "$workspace/root" "$workspace/cache" "$workspace/state"
          PATH=/no-host-interpreters "$bin_dir/debz" list-installed \
            --install-root "$workspace/root" \
            --cache-path "$workspace/cache" \
            --state-path "$workspace/state" \
            --status-path "$PWD/src/fixtures/dpkg-status/installed.status" \
            --architecture "$ARCHITECTURE" --json >"$workspace/output.json"
          jq --exit-status '.exit_status == 0' "$workspace/output.json"

  release-dry-run-verify:
    name: Required release dry-run exact verification
    needs: release-dry-run
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
