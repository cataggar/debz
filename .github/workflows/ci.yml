name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_full_matrix:
        description: "Run the standard build/test matrix (off for snapshot-only validation)"
        required: true
        type: boolean
        default: true
      ubuntu_snapshot_uri:
        description: "Pinned immutable Ubuntu snapshot URI"
        required: true
        type: string
        default: "https://snapshot.ubuntu.com/ubuntu/20261001T000000Z"
      ubuntu_snapshot_suite:
        description: "Pinned snapshot suite/codename"
        required: true
        type: string
        default: "resolute"
      run_arm64_dpkg_oracles:
        description: "Capture pinned dpkg 1.22.22 ARM64 oracle evidence"
        required: true
        type: boolean
        default: false
      run_native_real_snapshot:
        description: "Run native real-snapshot acceptance on amd64 and arm64"
        required: true
        type: boolean
        default: false
      run_protected_reference:
        description: "Stage root-owned inputs and run the protected pinned-dpkg reference proof on amd64 and arm64"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read
  attestations: read

jobs:
  setup-action-unit:
    name: Setup action unit and bundle checks
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Test and reproduce setup action bundles
        run: |
          npm --prefix actions/setup ci
          npm --prefix actions/setup audit --audit-level=high
          npm --prefix actions/setup test
          npm --prefix actions/setup run bundle
          git diff --exit-code -- actions/setup/dist

  setup-action-native:
    name: Setup action native (${{ matrix.target }})
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","Linux","{0}","ubuntu2604"]', matrix.runner == 'ubuntu-24.04-arm' && 'ARM64' || 'X64')) || matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            digest: 80c63abc6ba357733440de57b1f93441b1ac32d6a65da7dbfca4ccb78e1935ae
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            digest: 02833d0967790b309e0381a97f9b8e915549578fa60e0fdd0ff8a2b62ef1db6e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install v0.2.0 with GitHub provenance
        id: setup-provenance
        uses: ./actions/setup
        with:
          debz-version: v0.2.0
          cache: 'true'
      - name: Validate provenance installation
        env:
          CACHE_HIT: ${{ steps.setup-provenance.outputs.cache-hit }}
          DEBZ_PATH: ${{ steps.setup-provenance.outputs.debz-path }}
          DEBZ_VERSION: ${{ steps.setup-provenance.outputs.debz-version }}
          EXPECTED_TARGET: ${{ matrix.target }}
          TARGET: ${{ steps.setup-provenance.outputs.target }}
        run: |
          test -x "$DEBZ_PATH"
          test "$DEBZ_VERSION" = v0.2.0
          test "$TARGET" = "$EXPECTED_TARGET"
          case "$CACHE_HIT" in true|false) ;; *) exit 1 ;; esac
          test "$("$DEBZ_PATH" --version)" = 0.2.0
          "$DEBZ_PATH" --help >/dev/null
      - name: Install v0.2.0 with explicit trusted SHA-256
        id: setup-sha
        uses: ./actions/setup
        with:
          debz-version: v0.2.0
          sha256: ${{ matrix.digest }}
          cache: 'false'
      - name: Validate trusted-SHA installation
        env:
          DEBZ_PATH: ${{ steps.setup-sha.outputs.debz-path }}
          DEBZ_VERSION: ${{ steps.setup-sha.outputs.debz-version }}
          EXPECTED_TARGET: ${{ matrix.target }}
          TARGET: ${{ steps.setup-sha.outputs.target }}
        run: |
          test -x "$DEBZ_PATH"
          test "$DEBZ_VERSION" = v0.2.0
          test "$TARGET" = "$EXPECTED_TARGET"
          test "$("$DEBZ_PATH" --version)" = 0.2.0

  setup-action-container:
    name: Setup action in bare Ubuntu container
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm optional host tools are absent
        shell: sh
        run: |
          ! command -v python3
          ! command -v pipx
          ! command -v curl
          ! command -v gh
      - name: Install v0.2.0 without host download or archive tools
        id: setup
        uses: ./actions/setup
        with:
          debz-version: v0.2.0
          cache: 'false'
      - name: Validate clean-container installation
        shell: sh
        env:
          DEBZ_PATH: ${{ steps.setup.outputs.debz-path }}
          DEBZ_VERSION: ${{ steps.setup.outputs.debz-version }}
          TARGET: ${{ steps.setup.outputs.target }}
        run: |
          test -x "$DEBZ_PATH"
          test "$DEBZ_VERSION" = v0.2.0
          test "$TARGET" = linux-x64
          test "$("$DEBZ_PATH" --version)" = 0.2.0

  download-action-unit:
    name: Download action unit and bundle checks
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Test and reproduce download action bundle
        run: |
          npm --prefix actions/download ci
          npm --prefix actions/download audit --audit-level=high
          npm --prefix actions/download test
          npm --prefix actions/download run bundle
          git diff --exit-code -- actions/download/dist

  install-action-unit:
    name: Install action unit and bundle checks
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Test and reproduce install action bundle
        run: |
          npm --prefix actions/install ci
          npm --prefix actions/install audit --audit-level=high
          npm --prefix actions/install test
          npm --prefix actions/install run bundle
          git diff --exit-code -- actions/install/dist

  install-action-native:
    name: Install action native transaction (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Build CLI and action test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-jsonschema
          zig build -Doptimize=ReleaseSafe
          npm --prefix actions/install ci
          npm --prefix actions/install run build
      - name: Create signed exact-lock fixture
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          workspace="$PWD/.zig-cache/install-action-native"
          mkdir -p "$workspace/plan-root" "$workspace/plan-cache" "$workspace/plan-state"
          python3 tools/generate-integration-repository.py \
            --output "$workspace/repository" --suite debian-stable \
            --architecture "$ARCHITECTURE" --sha256-only
          cat >"$workspace/fixture.sources" <<EOF
          Types: deb
          URIs: file://$workspace/repository
          Suites: debian-stable
          Components: main
          Architectures: $ARCHITECTURE
          Signed-By: $workspace/repository/fixture-keyring.gpg
          EOF
          zig-out/bin/debz plan \
            --install-root "$workspace/plan-root" \
            --cache-path "$workspace/plan-cache" \
            --state-path "$workspace/plan-state" \
            --architecture "$ARCHITECTURE" \
            --source "$workspace/fixture.sources" \
            --keyring "$workspace/repository/fixture-keyring.gpg" \
            --lock-output "$workspace/lock.json" scenario-main --json >/dev/null
          zig-out/bin/debz plan \
            --install-root "$workspace/plan-root" \
            --cache-path "$workspace/plan-cache" \
            --state-path "$workspace/plan-state" \
            --architecture "$ARCHITECTURE" \
            --source "$workspace/fixture.sources" \
            --keyring "$workspace/repository/fixture-keyring.gpg" \
            --lock-output "$workspace/fail.lock.json" fail-script --json >/dev/null
      - name: Exercise cold, warm, offline, and same-root installs
        env:
          DEBZ_INSTALL_INTEGRATION: '1'
          DEBZ_INSTALL_INTEGRATION_SUDO: '1'
          DEBZ_INSTALL_FIXTURE_ROOT: ${{ github.workspace }}/.zig-cache/install-action-native
          DEBZ_INSTALL_CLI: ${{ github.workspace }}/zig-out/bin/debz
          DEBZ_INSTALL_ARCHITECTURE: ${{ matrix.architecture }}
        run: node --test --test-concurrency=1 actions/install/lib/__tests__/integration.test.js
      - name: Normalize install diagnostics
        if: always()
        run: sudo chown -R "$USER:$USER" .zig-cache/install-action-native || true

  download-action-cache:
    name: Download action cache semantics
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ubuntu2604]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.16.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.16.0
      - name: Build unique CLI and exact locks
        id: fixture
        env:
          VERSION: 0.3.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe \
            -Dversion="$VERSION"
          workspace="$PWD/.zig-cache/download-action"
          mkdir -p "$workspace/root" "$workspace/metadata" "$workspace/state"
          python3 tools/generate-integration-repository.py \
            --output "$workspace/repository" --suite debian-stable --architecture amd64 \
            --sha256-only
          python3 tools/generate-integration-repository.py \
            --output "$workspace/native-repository" --suite debian-stable --architecture amd64
          cat >"$workspace/fixture.sources" <<EOF
          Types: deb
          URIs: file://$workspace/repository
          Suites: debian-stable
          Components: main
          Architectures: amd64
          Signed-By: $workspace/repository/fixture-keyring.gpg
          EOF
          cat >"$workspace/native.sources" <<EOF
          Types: deb
          URIs: file://$workspace/native-repository
          Suites: debian-stable
          Components: main
          Architectures: amd64
          Signed-By: $workspace/native-repository/fixture-keyring.gpg
          EOF
          common=(
            --install-root "$workspace/root"
            --cache-path "$workspace/metadata"
            --state-path "$workspace/state"
            --architecture amd64
            --source "$workspace/fixture.sources"
            --keyring "$workspace/repository/fixture-keyring.gpg"
            --json
          )
          zig-out/bin/debz plan "${common[@]}" \
            --lock-output "$workspace/base.lock.json" base-dep >/dev/null
          zig-out/bin/debz plan "${common[@]}" \
            --lock-output "$workspace/scenario.lock.json" scenario-main >/dev/null
          native_common=(
            --install-root "$workspace/root"
            --cache-path "$workspace/metadata"
            --state-path "$workspace/state"
            --architecture amd64
            --source "$workspace/native.sources"
            --keyring "$workspace/native-repository/fixture-keyring.gpg"
            --json
          )
          zig-out/bin/debz plan "${native_common[@]}" --transaction-backend native \
            --lock-output "$workspace/base.native.lock.json" base-dep >/dev/null
          zig-out/bin/debz plan "${native_common[@]}" --transaction-backend native \
            --lock-output "$workspace/scenario.native.lock.json" scenario-main >/dev/null
          zig build build-native-action-empty-lock test-native-action-empty-lock \
            -Doptimize=ReleaseSafe -j2 --summary all
          PATH=/no-host-interpreters zig-out/bin/debz-native-action-empty-lock \
            "$workspace/base.native.lock.json" "$workspace/empty.native.lock.json"
          printf 'workspace=%s\nsource=%s\nkeyring=%s\nbase_lock=%s\nscenario_lock=%s\n' \
            "$workspace" "$workspace/fixture.sources" \
            "$workspace/repository/fixture-keyring.gpg" \
            "$workspace/base.lock.json" "$workspace/scenario.lock.json" \
            >>"$GITHUB_OUTPUT"
          printf 'native_base_lock=%s\nnative_scenario_lock=%s\nnative_empty_lock=%s\n' \
            "$workspace/base.native.lock.json" "$workspace/scenario.native.lock.json" \
            "$workspace/empty.native.lock.json" >>"$GITHUB_OUTPUT"
          printf 'native_source=%s\nnative_keyring=%s\n' \
            "$workspace/native.sources" \
            "$workspace/native-repository/fixture-keyring.gpg" >>"$GITHUB_OUTPUT"
          printf '%s\n' "$PWD/zig-out/bin" >>"$GITHUB_PATH"
      - name: Populate cold exact-lock cache
        id: cold
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.base_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-cold
      - name: Validate cold result
        env:
          CACHE_HIT: ${{ steps.cold.outputs.cache-hit }}
          MATCHED: ${{ steps.cold.outputs.cache-matched-key }}
          DOWNLOADED: ${{ steps.cold.outputs.downloaded-count }}
          REUSED: ${{ steps.cold.outputs.reused-count }}
        run: |
          test "$CACHE_HIT" = false
          test -z "$MATCHED"
          test "$DOWNLOADED" -gt 0
          test "$REUSED" -eq 0
      - name: Restore compatible partial cache
        id: partial
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-partial
      - name: Validate partial result
        env:
          CACHE_HIT: ${{ steps.partial.outputs.cache-hit }}
          MATCHED: ${{ steps.partial.outputs.cache-matched-key }}
          DOWNLOADED: ${{ steps.partial.outputs.downloaded-count }}
          REUSED: ${{ steps.partial.outputs.reused-count }}
        run: |
          test "$CACHE_HIT" = false
          test -n "$MATCHED"
          test "$DOWNLOADED" -gt 0
          test "$REUSED" -gt 0
      - name: Restore exact completed cache
        id: exact
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-exact
      - name: Validate exact result
        env:
          CACHE_HIT: ${{ steps.exact.outputs.cache-hit }}
          MATCHED: ${{ steps.exact.outputs.cache-matched-key }}
          DOWNLOADED: ${{ steps.exact.outputs.downloaded-count }}
          REUSED: ${{ steps.exact.outputs.reused-count }}
        run: |
          test "$CACHE_HIT" = true
          test -n "$MATCHED"
          test "$DOWNLOADED" -eq 0
          test "$REUSED" -gt 0
      - name: Corrupt one exact-restored object
        run: |
          object=$(find "$RUNNER_TEMP/debz-download-exact/packages-v2/objects" \
            -maxdepth 1 -type f -print -quit)
          test -n "$object"
          printf 'corrupt\n' >"$object"
      - name: Reject corrupt package object
        id: corrupt
        continue-on-error: true
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-exact
          cache: 'false'
          offline: 'true'
      - name: Validate corrupt-object failure
        env:
          CACHE_PATH: ${{ steps.corrupt.outputs.cache-path }}
          OUTCOME: ${{ steps.corrupt.outcome }}
        run: |
          test "$OUTCOME" = failure
          test -z "$CACHE_PATH"
          rm -rf "$RUNNER_TEMP/debz-download-exact"
      - name: Reject package-only offline restore
        id: offline
        continue-on-error: true
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.scenario_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-offline
          offline: 'true'
      - name: Validate offline metadata failure
        env:
          CACHE_PATH: ${{ steps.offline.outputs.cache-path }}
          OUTCOME: ${{ steps.offline.outcome }}
        run: |
          test "$OUTCOME" = failure
          test -z "$CACHE_PATH"
      - name: Populate native cold cache
        id: native-cold
        uses: ./actions/download
        with:
          transaction-backend: native
          lock-input: ${{ steps.fixture.outputs.native_base_lock }}
          source: ${{ steps.fixture.outputs.native_source }}
          keyring: ${{ steps.fixture.outputs.native_keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-native-cold
      - name: Restore native partial cache
        id: native-partial
        uses: ./actions/download
        with:
          transaction-backend: native
          lock-input: ${{ steps.fixture.outputs.native_scenario_lock }}
          source: ${{ steps.fixture.outputs.native_source }}
          keyring: ${{ steps.fixture.outputs.native_keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-native-partial
      - name: Restore native exact cache
        id: native-exact
        uses: ./actions/download
        with:
          transaction-backend: native
          lock-input: ${{ steps.fixture.outputs.native_scenario_lock }}
          source: ${{ steps.fixture.outputs.native_source }}
          keyring: ${{ steps.fixture.outputs.native_keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-native-exact
      - name: Validate native cache lifecycle
        env:
          COLD_HIT: ${{ steps.native-cold.outputs.cache-hit }}
          COLD_DOWNLOADED: ${{ steps.native-cold.outputs.downloaded-count }}
          COLD_REUSED: ${{ steps.native-cold.outputs.reused-count }}
          PARTIAL_HIT: ${{ steps.native-partial.outputs.cache-hit }}
          PARTIAL_KEY: ${{ steps.native-partial.outputs.cache-matched-key }}
          PARTIAL_DOWNLOADED: ${{ steps.native-partial.outputs.downloaded-count }}
          PARTIAL_REUSED: ${{ steps.native-partial.outputs.reused-count }}
          EXACT_HIT: ${{ steps.native-exact.outputs.cache-hit }}
          EXACT_KEY: ${{ steps.native-exact.outputs.cache-matched-key }}
          EXACT_DOWNLOADED: ${{ steps.native-exact.outputs.downloaded-count }}
          EXACT_REUSED: ${{ steps.native-exact.outputs.reused-count }}
        run: |
          test "$COLD_HIT" = false
          test "$COLD_DOWNLOADED" -gt 0
          test "$COLD_REUSED" -eq 0
          test "$PARTIAL_HIT" = false
          test "$PARTIAL_DOWNLOADED" -gt 0
          test "$PARTIAL_REUSED" -gt 0
          test "$EXACT_HIT" = true
          test "$EXACT_DOWNLOADED" -eq 0
          test "$EXACT_REUSED" -gt 0
          case "$PARTIAL_KEY:$EXACT_KEY" in
            debz-package-cas-v5-*:debz-package-cas-v5-*) ;;
            *) exit 1 ;;
          esac
      - name: Populate native empty cache
        id: native-empty
        uses: ./actions/download
        with:
          transaction-backend: native
          lock-input: ${{ steps.fixture.outputs.native_empty_lock }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-native-empty
          offline: 'true'
      - name: Restore native empty cache
        id: native-empty-exact
        uses: ./actions/download
        with:
          transaction-backend: native
          lock-input: ${{ steps.fixture.outputs.native_empty_lock }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-native-empty-exact
          offline: 'true'
      - name: Validate native empty closure
        env:
          COLD_HIT: ${{ steps.native-empty.outputs.cache-hit }}
          COLD_DOWNLOADED: ${{ steps.native-empty.outputs.downloaded-count }}
          COLD_REUSED: ${{ steps.native-empty.outputs.reused-count }}
          EXACT_HIT: ${{ steps.native-empty-exact.outputs.cache-hit }}
          EXACT_DOWNLOADED: ${{ steps.native-empty-exact.outputs.downloaded-count }}
          EXACT_REUSED: ${{ steps.native-empty-exact.outputs.reused-count }}
        run: |
          test "$COLD_HIT" = false
          test "$COLD_DOWNLOADED" -eq 0
          test "$COLD_REUSED" -eq 0
          test "$EXACT_HIT" = true
          test "$EXACT_DOWNLOADED" -eq 0
          test "$EXACT_REUSED" -eq 0
      - name: Refuse legacy lock in native action
        id: native-foreign-lock
        continue-on-error: true
        uses: ./actions/download
        with:
          transaction-backend: native
          lock-input: ${{ steps.fixture.outputs.base_lock }}
          source: ${{ steps.fixture.outputs.source }}
          keyring: ${{ steps.fixture.outputs.keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-native-foreign-lock
      - name: Refuse native lock in default legacy action
        id: legacy-foreign-lock
        continue-on-error: true
        uses: ./actions/download
        with:
          lock-input: ${{ steps.fixture.outputs.native_base_lock }}
          source: ${{ steps.fixture.outputs.native_source }}
          keyring: ${{ steps.fixture.outputs.native_keyring }}
          architecture: amd64
          cache-root: ${{ runner.temp }}/debz-download-legacy-foreign-lock
      - name: Validate explicit backend refusal
        env:
          NATIVE_OUTCOME: ${{ steps.native-foreign-lock.outcome }}
          NATIVE_PATH: ${{ steps.native-foreign-lock.outputs.cache-path }}
          LEGACY_OUTCOME: ${{ steps.legacy-foreign-lock.outcome }}
          LEGACY_PATH: ${{ steps.legacy-foreign-lock.outputs.cache-path }}
        run: |
          test "$NATIVE_OUTCOME" = failure
          test -z "$NATIVE_PATH"
          test "$LEGACY_OUTCOME" = failure
          test -z "$LEGACY_PATH"

  download-action-container-fixture:
    name: Build download action container fixture
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
