name: Focused tooling

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full candidate commit; must equal the dispatched branch head"
        required: true
        type: string
      source_tree:
        description: "Full candidate Git tree"
        required: true
        type: string
      selectors:
        description: "Space-separated pure tooling test selectors (see doc/safety-ci.md)"
        required: true
        type: string
        default: "test-integration-repository"
      architecture:
        description: "Native runner architectures"
        required: true
        type: choice
        options: [both, amd64, arm64]
        default: both
      optimize:
        description: "Optimization modes"
        required: true
        type: choice
        options: [both, Debug, ReleaseSafe]
        default: both

concurrency:
  group: focused-tooling-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  attestations: read

defaults:
  run:
    shell: bash

jobs:
  bind-source:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'cataggar/debz' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Bind candidate and plan pure tooling rows
        id: plan
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          SELECTORS: ${{ inputs.selectors }}
          ARCHITECTURE: ${{ inputs.architecture }}
          OPTIMIZE: ${{ inputs.optimize }}
        run: |
          node --test tools/test-tooling-fleet.mjs
          node tools/tooling-fleet.mjs plan

  tooling:
    needs: bind-source
    if: github.event_name == 'workflow_dispatch' && github.repository == 'cataggar/debz' && startsWith(github.ref, 'refs/heads/')
    name: Tooling (${{ matrix.selector }}, ${{ matrix.architecture }}, ${{ matrix.optimize }})
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bind-source.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@c4be68b52d67d7acd2a7fe6c1e5f126e1754176e # v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.8.1
          tools: >-
            cataggar/zig@v0.17.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Validate Zig version
        run: test "$(zig version)" = 0.17.0
      - name: Run bound unprivileged tooling selector
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          SELECTOR: ${{ matrix.selector }}
          ARCHITECTURE: ${{ matrix.architecture }}
          OPTIMIZE: ${{ matrix.optimize }}
        run: node tools/tooling-fleet.mjs run
      - name: Retain exact tooling reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-${{ github.sha }}-${{ matrix.selector }}-${{ matrix.architecture }}-${{ matrix.optimize }}-${{ github.run_attempt }}
          path: .cache/tooling-fleet/*/*/*/*/*/*/reports/
          if-no-files-found: error
          retention-days: 7
