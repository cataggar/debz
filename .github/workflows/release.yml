name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  attestations: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Package binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-linux-musl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, version, and main ancestry
        id: release
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          zon_version=$(python3 -c 'import pathlib,re; text=pathlib.Path("build.zig.zon").read_text(); match=re.search(r"(?m)^\s*\.version\s*=\s*\"([^\"]+)\"", text); assert match; print(match.group(1))')
          version=$(python3 tools/release.py version "$GITHUB_REF_NAME" --expect "zon=$zon_version")
          core=${version%%+*}
          prerelease=false
          case "$core" in
            *-*) prerelease=true ;;
          esac
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          printf 'version=%s\nzon_version=%s\nprerelease=%s\nepoch=%s\n' \
            "$version" "$zon_version" "$prerelease" "$epoch" >>"$GITHUB_OUTPUT"
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Build complete ReleaseSafe install prefix
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.release.outputs.version }}
        run: zig build -Dtarget="$TARGET" -Doptimize=ReleaseSafe -Dversion="$VERSION" release-install --prefix "$PWD/release-root"
      - name: Validate built version and package binary
        env:
          EPOCH: ${{ steps.release.outputs.epoch }}
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.ref_name }}
          ZON_VERSION: ${{ steps.release.outputs.zon_version }}
        run: |
          python3 tools/release.py version "$TAG" --expect "zon=$ZON_VERSION" \
            --expect "binary=$(release-root/bin/debz version)"
          python3 tools/release.py binary --tag "$TAG" --platform "$PLATFORM" \
            --prefix release-root --epoch "$EPOCH" --output release-assets
          for format in tar.gz tar.xz; do
            python3 tools/release.py audit --tag "$TAG" --platform "$PLATFORM" \
              --archive "release-assets/debz-${TAG#v}-$PLATFORM.$format" --smoke
          done
      - name: Upload binary release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ matrix.platform }}
          path: |
            release-assets/debz-${{ steps.release.outputs.version }}-${{ matrix.platform }}.tar.gz
            release-assets/debz-${{ steps.release.outputs.version }}-${{ matrix.platform }}.tar.xz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Verify, attest, and publish
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, version, and main ancestry
        id: release
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          zon_version=$(python3 -c 'import pathlib,re; text=pathlib.Path("build.zig.zon").read_text(); match=re.search(r"(?m)^\s*\.version\s*=\s*\"([^\"]+)\"", text); assert match; print(match.group(1))')
          version=$(python3 tools/release.py version "$GITHUB_REF_NAME" --expect "zon=$zon_version")
          core=${version%%+*}
          prerelease=false
          case "$core" in
            *-*) prerelease=true ;;
          esac
          printf 'version=%s\nprerelease=%s\n' "$version" "$prerelease" >>"$GITHUB_OUTPUT"
      - name: Download release assets without collisions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true
      - name: Verify exact four-archive release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 tools/release.py verify --tag "$GITHUB_REF_NAME" \
            --assets release-assets --smoke
      - name: Attest gzip archives
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-assets/*.tar.gz
      - name: Attest xz archives
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-assets/*.tar.xz
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          printf '%s\n' \
            '## Install' \
            '' \
            '```sh' \
            "ghr install cataggar/debz@v$VERSION" \
            '```' >release-body.md
          options=()
          if [ "$PRERELEASE" = true ]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/debz-$VERSION-linux-x64.tar.gz" \
            "release-assets/debz-$VERSION-linux-x64.tar.xz" \
            "release-assets/debz-$VERSION-linux-arm64.tar.gz" \
            "release-assets/debz-$VERSION-linux-arm64.tar.xz" \
            --title "debz $VERSION" --notes-file release-body.md --generate-notes \
            --fail-on-no-commits --verify-tag "${options[@]}"

  smoke:
    name: Post-release smoke (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and main ancestry
        id: release
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          zon_version=$(python3 -c 'import pathlib,re; text=pathlib.Path("build.zig.zon").read_text(); match=re.search(r"(?m)^\s*\.version\s*=\s*\"([^\"]+)\"", text); assert match; print(match.group(1))')
          version=$(python3 tools/release.py version "$GITHUB_REF_NAME" --expect "zon=$zon_version")
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
      - name: Install exact release with the first-party setup action
        id: setup
        uses: ./actions/setup
        with:
          debz-version: ${{ github.ref_name }}
          cache: 'false'
      - name: Validate setup action outputs and executable
        env:
          DEBZ_PATH: ${{ steps.setup.outputs.debz-path }}
          DEBZ_VERSION: ${{ steps.setup.outputs.debz-version }}
          EXPECTED_TARGET: ${{ matrix.platform }}
          TARGET: ${{ steps.setup.outputs.target }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -x "$DEBZ_PATH"
          test "$DEBZ_VERSION" = "$GITHUB_REF_NAME"
          test "$TARGET" = "$EXPECTED_TARGET"
          case "$DEBZ_PATH" in
            "$RUNNER_TEMP"/debz-tools/*/bin/debz) ;;
            *) echo "unexpected setup path: $DEBZ_PATH" >&2; exit 1 ;;
          esac
          test "$("$DEBZ_PATH" version)" = "$VERSION"
          "$DEBZ_PATH" --help >/dev/null
      - name: Install smoke tooling
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo apt-get install --yes --no-install-recommends \
            python3-pip python3-venv
      - name: Audit published archive and install exact release with ghr
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p .zig-cache/released
          gh release download "$GITHUB_REF_NAME" --dir .zig-cache/released \
            --pattern "debz-$VERSION-$PLATFORM.tar.gz"
          python3 tools/release.py audit --tag "$GITHUB_REF_NAME" \
            --platform "$PLATFORM" \
            --archive ".zig-cache/released/debz-$VERSION-$PLATFORM.tar.gz" --smoke
          python3 -m venv .zig-cache/ghr
          .zig-cache/ghr/bin/pip install ghr-bin==0.7.0
          .zig-cache/ghr/bin/ghr install cataggar/debz@v$VERSION
          bin_dir=$(.zig-cache/ghr/bin/ghr path bin)
          test -x "$bin_dir/debz"
          test "$("$bin_dir/debz" version)" = "$VERSION"
          "$bin_dir/debz" --help
          mkdir -p .zig-cache/smoke/root .zig-cache/smoke/cache .zig-cache/smoke/state
          "$bin_dir/debz" list-installed \
            --install-root "$PWD/.zig-cache/smoke/root" \
            --cache-path "$PWD/.zig-cache/smoke/cache" \
            --state-path "$PWD/.zig-cache/smoke/state" \
            --status-path "$PWD/src/fixtures/dpkg-status/installed.status" \
            --architecture "${{ matrix.architecture }}" --json >.zig-cache/smoke/output.json
          python3 -c 'import json; value=json.load(open(".zig-cache/smoke/output.json")); assert value["exit_status"] == 0'
